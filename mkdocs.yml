theme:
    name: material
    features:
        - navigation.sections
        - navigation.footer
        - toc.integrate
        - header.autohide
        - content.code.copy
    palette:
        - scheme: default
          primary: white
          accent: amber
          toggle:
             icon: material/weather-night
             name: Switch to dark mode
        - scheme: slate
          primary: black
          accent: amber
          toggle:
             icon: material/weather-sunny
             name: Switch to light mode
    icon:
        repo: fontawesome/brands/github

site_name: adda
site_description: The documentation for the adda library.
site_author: Elvis Aguero

repo_url: https://github.com/bessagroup/adda
repo_name: bessagroup/adda
edit_uri: ""

strict: true

markdown_extensions:
    - attr_list
    - md_in_html
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.superfences
    - pymdownx.details
    - pymdownx.snippets:
        base_path: docs
    - admonition
    - toc:
        permalink: "#"
        toc_depth: 4
    - footnotes

plugins:
    - search
    - include_exclude_files:
        exclude:
            - "_overrides"
    - ipynb
    - redirects:
        redirect_maps:
            'installation.md': 'install.md'
            'concepts.md': 'permission-graph.md'
            'authoring-a-study.md': 'author-a-study.md'
            'watching-a-run.md': 'watch-and-steer-a-run.md'
            'reading-a-run.md': 'read-a-runs-output.md'
            'troubleshooting.md': 'troubleshoot.md'
    - mkdocstrings:
        handlers:
            python:
                paths: [src]
                options:
                    docstring_style: numpy
                    force_inspection: false
                    heading_level: 4
                    inherited_members: true
                    members_order: source
                    show_bases: false
                    show_if_no_docstring: true
                    show_root_heading: true
                    show_signature_annotations: true
                    show_source: true
                    show_symbol_type_heading: true
                    show_symbol_type_toc: true
                    filters:
                        - "!^__.*__$"

nav:
    - Home: 'index.md'
    - Get started:
        - 'Install': 'install.md'
        - 'Quickstart': 'notebooks/quickstart.ipynb'
    - Guides:
        - 'Author a study': 'author-a-study.md'
        - 'Watch and steer a run': 'watch-and-steer-a-run.md'
        - "Read a run's output": 'read-a-runs-output.md'
        - 'Customize a run': 'customizing-a-run.md'
        - 'Troubleshoot': 'troubleshoot.md'
    - Concepts:
        - 'The permission graph': 'permission-graph.md'
        - 'How a run is kept honest': 'how-a-run-is-kept-honest.md'
    - Reference:
        - 'Configuration reference': 'config-reference.md'
        - 'Runtime reference': 'runtime-reference.md'
        - 'Command-line reference': 'cli.md'
        - 'Python API':
            - 'api/index.md'
            - 'api/run.md'
            - 'api/agents.md'
            - 'api/graph.md'
            - 'api/evaluator.md'
            - 'api/backends.md'
            - 'api/math.md'
    - License: 'license.md'
