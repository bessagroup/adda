name: Tests

on:
  pull_request:
  push:
    branches:
      - main
    # promptmap.published.json is a publish-metadata record, not the map
    # itself -- a push that touches ONLY this file has nothing for
    # check_promptmap (or any test) to check. Still runs normally whenever
    # this file changes ALONGSIDE promptmap.html/promptmap.py (paths-ignore
    # only skips a push whose changed files are ALL in this list).
    paths-ignore:
      - "internal/promptmap.published.json"
  schedule:
    # Full OS x 4-version matrix nightly, independent of push/PR activity, so
    # version-specific regressions (e.g. the py3.10 cf.TimeoutError bug,
    # 410ac0d) surface even between merges.
    - cron: "0 6 * * *"

# A rapid run of small commits pushed straight to main (this repo's own
# workflow -- no PR ceremony) queues one full run per push, six deep on one
# busy day, each waiting out the full matrix before the NEXT one even starts
# -- pure backlog, since only the LAST commit's result is what anyone acts
# on. `github.event_name` in the group key keeps push/PR/schedule fully
# separate queues (so this only ever touches OTHER pushes to main, never a
# PR's own run or the nightly full matrix); cancel-in-progress only for
# push means an in-flight run for an older main commit is cancelled the
# moment a newer one supersedes it -- a PR's repeated pushes still just
# queue, unaffected, and the nightly schedule shares no group with either.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  run-tests:
    strategy:
      matrix:
        # adda is POSIX/HPC-oriented (process-group reaping, signals, SLURM);
        # Windows is not a supported target.
        #
        # Every PR push runs a single fast combo (quick feedback loop); push
        # to main (post-merge) runs 2 OS x the oldest and newest supported
        # Pythons (3.10, 3.13); the nightly schedule runs the full 2 OS x 4
        # versions, so version-specific regressions in 3.11/3.12 still
        # surface without gating every push on the full grid.
        os: >-
          ${{ github.event_name == 'pull_request'
              && fromJSON('["ubuntu-latest"]')
              || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        version: >-
          ${{ github.event_name == 'pull_request'
              && fromJSON('["3.12"]')
              || github.event_name == 'schedule'
              && fromJSON('["3.10", "3.11", "3.12", "3.13"]')
              || fromJSON('["3.10", "3.13"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # Second line of defence behind pytest-timeout's own per-test bound
    # (pyproject.toml, `[tool.pytest.ini_options]`): if a hang somehow
    # outlives that (e.g. pytest-timeout itself misbehaving, or something
    # stuck outside any single test's boundary), the JOB still gets killed
    # well short of GitHub's 6-hour ceiling instead of quietly burning
    # Actions minutes with nothing to show for it.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1 shallow clone.
          # test_paper_attestation.py checks that ATTESTATION.json's
          # reviewed_through sha is a real commit here -- a dangling
          # attestation is worse than none, because the hook then silently
          # stops reporting drift. Under a shallow clone that sha is absent,
          # so the test skipped and the guard was dark in the one place it
          # most needs to run. Fetch everything so it actually runs.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[tests,all]'
      # The viewer's browser tests skip without a real Chromium, and a skipped
      # test protects nothing — this is what makes them a gate rather than a
      # note. --with-deps is Linux-only; macOS ships what Chromium needs.
      - name: Install Chromium for the viewer's browser tests
        run: |
          python -m playwright install chromium ${{
            runner.os == 'Linux' && '--with-deps' || '' }}
      # `promptmap` tests are excluded here: they rebuild the whole prompt
      # corpus (~340s combined) and would otherwise pay that cost in EVERY
      # matrix leg; check_promptmap runs them once instead (see that job
      # below). -n auto runs the rest under pytest-xdist; pytest-cov combines
      # each worker's coverage automatically, so --cov-fail-under still gates
      # the same `adda` package, just measured across parallel workers.
      - name: Test with pytest
        env:
          # -n auto starts one worker per core; without this, each worker's
          # OWN torch/OpenMP/BLAS then ALSO spawns a per-core thread pool --
          # N workers x N threads oversubscribing every physical core on a
          # small CI runner. tests/conftest.py sets these too (belt-and-
          # suspenders for local -n auto runs); setting them here is the
          # more reliable of the two for CI, since it's in place before the
          # pytest process (and anything it imports) even starts.
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          TORCH_NUM_THREADS: "1"
        run: |
          pytest -n auto -m "not integration and not ollama and not corpus and not promptmap and not docling"
  build-docs:
    strategy:
      matrix:
        os: [ubuntu-latest]
        version: ["3.10"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[docs,all]'
      - name: Build documentation
        run: |
          mkdocs build
  check_promptmap:
    strategy:
      matrix:
        os: [ubuntu-latest]
        version: ["3.12"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[tests,all]'
      # internal/promptmap.html is a committed, generated artifact -- its
      # whole value is that a reader can open it without running anything.
      # Regenerate it with no flags (the committed copy carries no build
      # stamp, so this is deterministic) and fail loudly if it drifted from
      # what's checked in, instead of letting a stale map keep lying about
      # the system.
      #
      # --editable matters here, not just style: promptmap.py resolves each
      # role's module file via `type(agent).__module__`, and locates it with
      # Path.relative_to(REPO). A non-editable install puts adda's package
      # under site-packages, outside REPO, which raised ValueError here --
      # matches build-docs' own --editable install above.
      - name: Regenerate the prompt map and diff against the committed copy
        run: |
          python internal/tools/promptmap.py -o /tmp/promptmap.html
          if ! diff -q internal/promptmap.html /tmp/promptmap.html > /dev/null; then
            echo "::error::internal/promptmap.html is stale. Run 'python internal/tools/promptmap.py' locally and commit the regenerated file."
            diff internal/promptmap.html /tmp/promptmap.html || true
            exit 1
          fi
      # The deeper provenance checks (test_promptmap.py: every gate symbol
      # resolves, every prompt section's citation is real, the committed map
      # matches the code) run HERE, once, instead of in every run-tests
      # matrix leg (moved out in the same commit — see that job's comment).
      # --no-cov: this job never claimed the --cov-fail-under=85 gate (it
      # used to be a raw diff script with no pytest at all), and this
      # marker's tests alone touch too small a slice of `adda` to mean
      # anything against that gate — run-tests' own coverage run is
      # unaffected by this job either way.
      - name: Run the promptmap provenance tests
        run: |
          pytest -m promptmap --no-cov
  check_docling:
    # Real Docling PDF extraction is model inference: ~minutes per test on a
    # loaded runner, and on the macOS legs it timed out under -n auto
    # contention. It runs once here, alone, with its own explicit per-test
    # timeout (the tests carry pytest.mark.timeout(600)), instead of in
    # every matrix leg.
    strategy:
      matrix:
        os: [ubuntu-latest]
        version: ["3.12"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[tests,all]'
      - name: Run the Docling PDF extraction tests
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          TORCH_NUM_THREADS: "1"
        run: |
          pytest -m docling --no-cov
  check_pre-commit:
    strategy:
      matrix:
        os: [ubuntu-latest]
        version: ["3.10"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files
