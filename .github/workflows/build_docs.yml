name: Build docs

on:
  push:
    branches:
      - main
    # internal/ is dev docs, not part of the published MkDocs site -- a push
    # touching ONLY the promptmap publish-metadata record has no effect on
    # this build. See pull_request.yml's matching paths-ignore for why.
    paths-ignore:
      - "internal/promptmap.published.json"

# Deploy the MkDocs site to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-progress Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[docs,all]'
      - name: Build docs
        run: mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
