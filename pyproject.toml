[project]
authors = [
  {email = "elvis_alexander_aguero_vera@brown.edu", name = "Elvis Aguero"}
]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS"
]
# adda depends on f3dasm as an external, pinned library. It carries NO copy of
# f3dasm core. See PORTING.md for the two behaviours still to be re-homed on the
# adda side (to_numpy metadata-column drop, protected-store guard) and the pin
# bump + import flip owed once bessagroup/f3dasm#351 lands.
dependencies = [
  "f3dasm>=2.4.0",
  "sympy>=1.13",
  "claude-agent-sdk>=0.2.82,<1.0.0",
  "pymupdf>=1.24.0",
  "rank-bm25>=0.2.2",
  "nbclient>=0.7",
  "nbformat>=5.9",
  "ipykernel>=6.0",
  "semanticscholar>=0.8.0",
  "arxiv>=2.1.0",
  "langchain-community>=0.3.0,<1.0.0",
  "langchain-core>=0.3.0",
  "langchain-ollama>=0.2.0,<1.0.0",
  "langchain-openai>=0.3.0,<1.0.0",
  "langgraph>=0.6.11",
  "langgraph-checkpoint-sqlite>=3.0.3",
  "ollama>=0.4.0",
  "requests>=2.28.0",
  "psutil>=5.9.0"
]
description = "adda - Agentic Data-Driven Design and Analysis"
license = {text = "BSD-3-Clause"}
maintainers = [
  {email = "elvis_alexander_aguero_vera@brown.edu", name = "Elvis Aguero"}
]
name = "adda"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.optional-dependencies]
# Building the offline Abaqus documentation corpus. The reader needs nothing
# beyond the stdlib; the BUILDER parses the documentation's HTML with lxml,
# which currently arrives only as a transitive of `arxiv` — the same
# undeclared-transitive trap the viewer extra below is declared to avoid.
abaqus = [
  "lxml>=5.0"
]
all = [
  "adda[abaqus]",
  "adda[extra]",
  "adda[viewer]"
]
dev = [
  "pre-commit>=4.4.0",
  "ruff>=0.14.10"
]
docs = [
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-include-exclude-files>=0.1.0",
  "mkdocs-ipynb>=0.1.1",
  "mkdocs-material>=9.6.20",
  "mkdocstrings>=0.30.1",
  "mkdocstrings-python>=1.18.2",
  "pymdown-extensions>=10.16.1"
]
# Layout-aware PDF to Markdown via docling (pulls torch). Excluded on Intel
# macOS, where the lean pymupdf path is used. Mirrors f3dasm's agentic-extra.
extra = [
  "docling>=2.0.0; sys_platform != 'darwin' or platform_machine == 'arm64'"
]
tests = [
  "hypothesis>=6.138.0",
  "httpx>=0.27",
  # The viewer's behaviour lives in 118 KB of browser JavaScript that no HTTP
  # assertion reaches. tests/test_viewer_browser.py drives it for real; without
  # this it SKIPS, and a skipped test protects nothing.
  "playwright>=1.47",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "pytest-timeout>=2.3.1",
  "pytest-xdist>=3.6.1",
  "tomli>=2.0; python_version < '3.11'"
]
# Read-only live run viewer (`python -m adda.viewer <study-dir>`). Starlette
# and uvicorn already resolve transitively (via claude-agent-sdk -> mcp), and
# jinja2 via mkdocs, but are declared explicitly here rather than relied on
# as undeclared transitive dependencies that could disappear if mcp/mkdocs
# ever drop them.
viewer = [
  "starlette>=0.37",
  "uvicorn>=0.30",
  "jinja2>=3.1"
]

[project.scripts]
# The agent-facing surface: `adda-docs "<question>"`. A console script
# rather than an MCP server because it needs no configuration -- any coding
# agent with a shell can call it on the first try.
adda-docs = "adda.explain:main"

[project.urls]
Documentation = "https://elvis-aguero.github.io/adda/"
Repository = "https://github.com/elvis-aguero/adda"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug",
  "raise AssertionError",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if 0:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod"
]

[tool.coverage.run]
branch = true
omit = ["tests/", "**/__init__.py"]
source = ["src"]

[tool.pytest.ini_options]
addopts = "--cov-report term --cov-report html --cov-config=.coveragerc --cov=adda --cov-fail-under=85.00"
# Global bound so a regression that reintroduces a missed wake (a blocked
# SendMessage/Wait predicate, a hung thread join) fails the ONE test that
# hit it within seconds, instead of riding out to GitHub's 6-hour job
# ceiling with nothing else telling you which test is stuck. The `thread`
# method dumps every thread's stack on timeout -- for a hang inside a
# blocking primitive that IS the diagnostic (which lock, which predicate).
# Raise per-test with @pytest.mark.timeout(n) only where a test is
# legitimately slower than this, not to paper over a real hang.
timeout = 120
timeout_method = "thread"
markers = [
  "smoke",
  "requires_dependency(name): mark the test as it requires a certain dependency",
  "ollama: marks tests that require a running Ollama server (skip with -m 'not ollama')",
  "integration: wet tests that hit real LLMs and external APIs (skip with -m 'not integration')",
  "corpus: needs a third-party corpus nobody can ship (Abaqus docs, a Basilisk checkout). OPTIONAL in CI -- the f3dasm and adda retrieval suites are not, and are required on every push",
  "promptmap: rebuilds the whole prompt corpus (~170s) to check internal/promptmap.html's provenance. Runs once in CI's check_promptmap job, not per matrix leg (skip locally with -m 'not promptmap')"
]
minversion = "6.0"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
exclude = ["__pycache__", "dist", "*.egg", ".git", "tests/*", "studies/*", "docs/*"]
ignore = ["E226", "E3", "E501", "E731", "C901", "UP045", "B027", "B012"]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.uv]
package = true
