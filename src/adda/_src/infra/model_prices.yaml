# Per-model list prices, USD per million tokens (MTok). Read by
# infra/telemetry.py to compute `cost_usd_computed` from EXACT token counts.
# It is recorded ALONGSIDE the SDK's own `total_cost_usd` and never merged into
# it: the SDK figure is authoritative where it exists; this one exists for the
# calls that carry no SDK cost (the strategizer, whose stream is cut by
# route_watcher before the SDK's ResultMessage arrives).
#
# Source: https://platform.claude.com/docs/en/about-claude/pricing (model
# pricing table, verified 2026-09-28). Cache multipliers on that page: 5-minute
# write 1.25x base input, 1-hour write 2x, read 0.1x -- EXCEPT Claude Opus 5.5,
# whose cache read is 0.05x. The numbers below are the page's, not derived.
#
# Cache writes are priced per TTL: telemetry rows carry the SDK's
# `cache_creation.ephemeral_{1h,5m}_input_tokens` split. Only when a call
# reports the combined count alone (a backend/stream without the split) is the
# combined count priced at the 1-hour rate -- adda's claude sessions are
# observed writing 1-hour entries.
#
# A model absent from this file gets cost_usd_computed = None and a logged
# warning -- never a silent zero. Keys match a model id exactly or with a
# trailing -YYYYMMDD snapshot suffix (claude-haiku-4-5-20251001).
models:
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write_5m: 5.00
    cache_write_1h: 8.00
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write_5m: 2.50
    cache_write_1h: 4.00
  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write_5m: 2.50
    cache_write_1h: 4.00
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write_5m: 1.25
    cache_write_1h: 2.00
