ol, permission, or way to test/inspect your own work (e.g. no way to run or debug a deliverable you had to author)? Name it specifically, or 'none'. (We want CAPABILITY GAPS, not just counterintuitive rules — be honest; an unreported gap can't be fixed.)\nThis will NOT reopen the run.", "constant": "_EXIT_INTERVIEW", "file": "src/adda/_src/nodes/tools/routing/feedback.py", "line": 34, "line_end": 55, "source_expr": "_EXIT_INTERVIEW", "edit": {"ok": true, "mode": "constant", "key": "src~adda~_src~nodes~tools~routing~feedback.py:34-55", "file": "src/adda/_src/nodes/tools/routing/feedback.py", "line": 34, "line_end": 55}}, {"text": "<prefix><self._enter_retrospective_round(banner + summary)>", "file": "src/adda/_src/nodes/tools/routing/feedback.py", "line": 454, "line_end": 454, "source_expr": "prefix + self._enter_retrospective_round(banner + summary)", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~feedback.py:454-454", "file": "src/adda/_src/nodes/tools/routing/feedback.py", "line": 454, "line_end": 454}}, {"text": "<prefix>Critic verdict: {verdict}. Address the findings below and revise your conclusion, then call Done() again — a run closes only on a critic PASS. If these objections stay unresolved, the run will close UNGATED with them on record, so resolve the substance rather than re-submitting unchanged.\n\n<critique_text>", "file": "src/adda/_src/nodes/tools/routing/feedback.py", "line": 456, "line_end": 461, "source_expr": "prefix +\n            f\"Critic verdict: {verdict}. Address the findings below and \"\n            \"revise your conclusion, then call Done() again — a run closes \"\n            \"only on a critic PASS. If these objections stay unresolved, the \"\n            \"run will close UNGATED with them on record, so resolve the \"\n            \"substance rather than re-submitting unchanged.\\n\\n\" + critique_text", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~feedback.py:456-461", "file": "src/adda/_src/nodes/tools/routing/feedback.py", "line": 456, "line_end": 461}}]}, {"id": "cited", "title": "Cited delegation must exist", "kind": "hard", "phase": "HypothesisUpdate()", "module": "nodes/tools/routing/ledger.py", "symbol": "LedgerTools._check_cited_delegation", "effect": "Evidence must name a delegation that actually ran.", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 202, "signature": "LedgerTools._check_cited_delegation", "match": "symbol", "span": false, "done_order": null, "messages": [{"text": "ERROR: evidence['delegation'] for {hypothesis_id} must name ONE delegation — the one whose report contains the cited numbers — not several ({d_cited}). A verdict has to be attributable to a single source; cite the authoritative one and mention the others in `comment` or the numbers dict.", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 219, "line_end": 223, "source_expr": "f\"ERROR: evidence['delegation'] for {hypothesis_id} must name \"\n                \"ONE delegation — the one whose report contains the cited \"\n                f\"numbers — not several ({d_cited!r}). A verdict has to be \"\n                \"attributable to a single source; cite the authoritative one \"\n                \"and mention the others in `comment` or the numbers dict.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~ledger.py:219-223", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 219, "line_end": 223}}, {"text": "<self._check_d000_pool_exists(hypothesis_id)>", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 226, "line_end": 226, "source_expr": "self._check_d000_pool_exists(hypothesis_id)", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~ledger.py:226-226", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 226, "line_end": 226}}, {"text": "ERROR: {hypothesis_id} cites evidence from {d_cited}, which is not a completed delegation. Only cite completed delegations (status DONE) — if the delegation hasn't finished, wait for it.", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 235, "line_end": 238, "source_expr": "f\"ERROR: {hypothesis_id} cites evidence from {d_cited!r}, \"\n                \"which is not a completed delegation. Only cite completed \"\n                \"delegations (status DONE) — if the delegation hasn't \"\n                \"finished, wait for it.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~ledger.py:235-238", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 235, "line_end": 238}}]}, {"id": "links", "title": "Delegation hypothesis links", "kind": "hard", "phase": "Delegate()", "module": "nodes/tools/routing/delegation.py", "symbol": "DelegationTools._check_hypothesis_links", "effect": "A delegation must be anchored to hypotheses that exist.", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1890, "signature": "DelegationTools._check_hypothesis_links", "match": "symbol", "span": false, "done_order": null, "messages": [{"text": "ERROR: hypothesis_ids must not be empty. Every delegation must be linked to at least one hypothesis. Call HypothesisList() to see open hypotheses.", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1928, "line_end": 1931, "source_expr": "\"ERROR: hypothesis_ids must not be empty. \"\n                    \"Every delegation must be linked to at \"\n                    \"least one hypothesis. Call \"\n                    \"HypothesisList() to see open hypotheses.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~delegation.py:1928-1931", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1928, "line_end": 1931}}, {"text": "ERROR: unknown hypothesis IDs {unknown}. Valid IDs: {sorted(known) or '(none proposed yet)'}.", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1939, "line_end": 1941, "source_expr": "f\"ERROR: unknown hypothesis IDs {unknown}.\"\n                f\" Valid IDs: \"\n                f\"{sorted(known) or '(none proposed yet)'}.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~delegation.py:1939-1941", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1939, "line_end": 1941}}]}, {"id": "duplicate", "title": "Duplicate evaluations", "kind": "soft", "phase": "continuous", "module": "epistemics/science_monitor.py", "symbol": "ScienceMonitor._check_duplicate_evaluations", "effect": "Injected as an in-band notice; never blocks.", "file": "src/adda/_src/epistemics/science_monitor.py", "line": 135, "signature": "ScienceMonitor._check_duplicate_evaluations", "match": "symbol", "span": false, "done_order": null, "messages": []}, {"id": "budget", "title": "Evaluation budget broadcast", "kind": "soft", "phase": "continuous", "module": "nodes/tools/routing/delegation.py", "symbol": "DelegationTools._budget_broadcast", "effect": "Budget pressure reaches the agent as an in-band notice; never blocks.", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 2422, "signature": "DelegationTools._budget_broadcast", "match": "symbol", "span": false, "done_order": null, "messages": []}, {"id": "falsification_checkpoint", "title": "Falsification checkpoint", "kind": "soft", "phase": "Delegate()", "module": "nodes/tools/routing/delegation.py", "symbol": "DelegationTools._falsification_checkpoint", "effect": "Prompts for a falsification attempt when the ledger has gone one-sided.", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1540, "signature": "DelegationTools._falsification_checkpoint", "match": "symbol", "span": false, "done_order": null, "messages": [{"text": "⚖ FALSIFICATION CHECKPOINT — {delegation_id} was declared a falsification attempt of {tested}. Record the VERDICT now via HypothesisUpdate(<id>, status=SUPPORTED|FALSIFIED|INCONCLUSIVE, evidence={'delegation': '{delegation_id}', 'numbers': {…}}), judging THIS report against that pre-registered prediction. Do not move on with the hypothesis left OPEN.", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1583, "line_end": 1590, "source_expr": "f\"⚖ FALSIFICATION CHECKPOINT — {delegation_id} was declared \"\n                f\"a falsification attempt of {tested}. Record the VERDICT now \"\n                \"via HypothesisUpdate(<id>, \"\n                \"status=SUPPORTED|FALSIFIED|INCONCLUSIVE, \"\n                f\"evidence={{'delegation': '{delegation_id}', \"\n                \"'numbers': {…}}), judging THIS report against that \"\n                \"pre-registered prediction. Do not move on with the \"\n                \"hypothesis left OPEN.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~delegation.py:1583-1590", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1583, "line_end": 1590}}, {"text": "⚖ FALSIFICATION CHECKPOINT — was {delegation_id} an attempt to test a registered hypothesis's pre-registered prediction? Open: {listing}. If YES: record the verdict with HypothesisUpdate against that prediction, citing {delegation_id} as evidence with falsification_attempt=True. Mark it ONLY if {delegation_id} genuinely tested that prediction — do not retrofit an exploratory result onto a hypothesis. If it was exploration/setup, there is no hypothesis to attach — continue (no action needed).", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1598, "line_end": 1606, "source_expr": "f\"⚖ FALSIFICATION CHECKPOINT — was {delegation_id} an attempt to \"\n            \"test a registered hypothesis's pre-registered prediction? Open: \"\n            f\"{listing}. If YES: record the verdict with HypothesisUpdate \"\n            f\"against that prediction, citing {delegation_id} as evidence with \"\n            f\"falsification_attempt=True. Mark it ONLY if {delegation_id} \"\n            \"genuinely tested \"\n            \"that prediction — do not retrofit an exploratory result onto a \"\n            \"hypothesis. If it was exploration/setup, there is no hypothesis \"\n            \"to attach — continue (no action needed).\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~delegation.py:1598-1606", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1598, "line_end": 1606}}]}, {"id": "headline", "title": "Headline consistency", "kind": "soft", "phase": "reproduction gate", "module": "nodes/reproduction_gate.py", "symbol": "_headline_consistency", "effect": "Stated answer must match the computed one — lenient: silent if either marker is absent.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 20, "signature": "_headline_consistency", "match": "symbol", "span": false, "done_order": null, "messages": [{"text": "Headline inconsistency: the write-up states CLAIMED_HEADLINE={claim} but the notebook's own computation prints REPRODUCED={rep}. The reported answer must be what the notebook computes — fix the selection (e.g. an idxmax picking a noise/near-duplicate row) or the prose so the stated and computed headlines agree.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 45, "line_end": 49, "source_expr": "f\"Headline inconsistency: the write-up states CLAIMED_HEADLINE=\"\n            f\"{claim} but the notebook's own computation prints REPRODUCED=\"\n            f\"{rep}. The reported answer must be what the notebook computes — \"\n            \"fix the selection (e.g. an idxmax picking a noise/near-duplicate \"\n            \"row) or the prose so the stated and computed headlines agree.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~reproduction_gate.py:45-49", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 45, "line_end": 49}}]}, {"id": "milestone_block", "title": "Implementer delegation block", "kind": "hard", "phase": "Delegate()", "module": "nodes/tools/routing/delegation.py", "symbol": "DelegationTools._milestone_gate", "switch": "milestones_enabled", "escape": "MilestoneSet(id, 'SKIPPED', note=reason)", "policy": ["epistemics/milestones.py", "implementer_block"], "effect": "No delegation to the implementer until the backlog is resolved.", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1945, "signature": "DelegationTools._milestone_gate", "match": "symbol", "span": false, "done_order": null, "messages": [{"text": "[CONFIRM] process backlog still open for {_scope}: {_ids}. The usual path is to resolve each first — MilestoneSet(id, 'DONE', note=…), or MilestoneSet(id, 'SKIPPED', note=…) if it doesn't apply. If you mean to run the implementer anyway, re-delegate (same target) to confirm. (Not a tool error; a process nudge.)", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1982, "line_end": 1987, "source_expr": "f\"[CONFIRM] process backlog still open for {_scope}: \"\n            f\"{_ids}. The usual path is to resolve each first — \"\n            \"MilestoneSet(id, 'DONE', note=…), or MilestoneSet(id, \"\n            \"'SKIPPED', note=…) if it doesn't apply. If you mean to run the \"\n            \"implementer anyway, re-delegate (same target) to \"\n            \"confirm. (Not a tool error; a process nudge.)\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~delegation.py:1982-1987", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1982, "line_end": 1987}}]}, {"id": "verdict", "title": "Live verdict validator", "kind": "soft", "phase": "HypothesisUpdate()", "module": "epistemics/verdict_validator.py", "symbol": "build_judge_prompt", "switch": "F3DASM_VERDICT_VALIDATOR", "effect": "An independent referee judges a closing verdict against the same charter.", "file": "src/adda/_src/epistemics/verdict_validator.py", "line": 32, "signature": "build_judge_prompt", "match": "symbol", "span": false, "done_order": null, "messages": [{"text": "You are an independent referee applying the SCIENTIFIC-METHOD CHARTER to ONE\nproposed hypothesis-verdict change. Judge ONLY whether the verdict's SUBSTANCE\nobeys the charter — not its wording, not the deliverable, not anything else.\n\n<charter>\n{FALSIFICATION_CHARTER}\n</charter>\n\nTHE HYPOTHESIS\n  statement: {statement}\n  registered prediction: {prediction}\n  falsification criterion: {criterion}\n\nTHE PROPOSED VERDICT\n  status -> {status}\n  rationale (comment): {comment}\n  cited evidence: {evidence}\n\nTHE CITED DELEGATION'S RESULT (the work the verdict rests on)\n{report}\n{prior_block}\nCheck three things, each by clause number:\n  1. §2 ATTEMPT ADEQUACY — did the cited work SEVERELY test the REGISTERED\n     prediction (could it have refuted the claim had it been false), or is it a\n     token / off-target probe?\n  2. §3 VERDICT FOLLOWS — does {status} follow from the cited result?\n     (adequate & contradicted -> FALSIFIED; adequate & survived -> SUPPORTED;\n      inadequate or confounded -> INCONCLUSIVE.)\n  3. §4 NO GOALPOST MOVE — if FALSIFIED, does it rest on the SAME registered\n     prediction, not a post-hoc observation?\n\nReply in EXACTLY this format and nothing else:\nSUBSTANCE: OK\n— or —\nSUBSTANCE: FLAG\nCRITIQUE: <one or two sentences naming the clause and the concrete problem>\n\nOK = all three checks pass. FLAG = at least one fails; the CRITIQUE must name the\nclause and the specific problem. When genuinely unsure, prefer OK — this is\nadvisory and the strategizer stays in control.", "file": "src/adda/_src/epistemics/verdict_validator.py", "line": 73, "line_end": 113, "source_expr": "f\"\"\"\\\nYou are an independent referee applying the SCIENTIFIC-METHOD CHARTER to ONE\nproposed hypothesis-verdict change. Judge ONLY whether the verdict's SUBSTANCE\nobeys the charter — not its wording, not the deliverable, not anything else.\n\n<charter>\n{FALSIFICATION_CHARTER}\n</charter>\n\nTHE HYPOTHESIS\n  statement: {statement}\n  registered prediction: {prediction}\n  falsification criterion: {criterion}\n\nTHE PROPOSED VERDICT\n  status -> {status}\n  rationale (comment): {comment}\n  cited evidence: {evidence!r}\n\nTHE CITED DELEGATION'S RESULT (the work the verdict rests on)\n{report}\n{prior_block}\nCheck three things, each by clause number:\n  1. §2 ATTEMPT ADEQUACY — did the cited work SEVERELY test the REGISTERED\n     prediction (could it have refuted the claim had it been false), or is it a\n     token / off-target probe?\n  2. §3 VERDICT FOLLOWS — does {status} follow from the cited result?\n     (adequate & contradicted -> FALSIFIED; adequate & survived -> SUPPORTED;\n      inadequate or confounded -> INCONCLUSIVE.)\n  3. §4 NO GOALPOST MOVE — if FALSIFIED, does it rest on the SAME registered\n     prediction, not a post-hoc observation?\n\nReply in EXACTLY this format and nothing else:\nSUBSTANCE: OK\n— or —\nSUBSTANCE: FLAG\nCRITIQUE: <one or two sentences naming the clause and the concrete problem>\n\nOK = all three checks pass. FLAG = at least one fails; the CRITIQUE must name the\nclause and the specific problem. When genuinely unsure, prefer OK — this is\nadvisory and the strategizer stays in control.\"\"\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~epistemics~verdict_validator.py:73-113", "file": "src/adda/_src/epistemics/verdict_validator.py", "line": 73, "line_end": 113}}]}, {"id": "reviewer", "title": "Problem-statement review", "kind": "advisory", "phase": "pre-run", "module": "epistemics/reviewer.py", "symbol": "review_gaps", "effect": "Always writes a report; never blocks a run.", "file": "src/adda/_src/epistemics/reviewer.py", "line": 131, "signature": "review_gaps", "match": "symbol", "span": false, "done_order": null, "messages": []}, {"id": "report_shape", "title": "Report shape retry", "kind": "soft", "phase": "worker return", "module": "nodes/parsing.py", "symbol": "_classify_response", "effect": "A worker report limit. Check whether the task asked for something outside its tool set.", "constant": "REFLECT_DIAGNOSIS_CAPABILITY_LIMIT", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 397, "line_end": 400, "source_expr": "REFLECT_DIAGNOSIS_CAPABILITY_LIMIT", "edit": {"ok": true, "mode": "constant", "key": "src~adda~_src~prompts~agent_prompts.py:397-400", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 397, "line_end": 400}}, {"text": "Implementer started a Report but omitted required subsections: {missing_subsections}.", "constant": "REFLECT_DIAGNOSIS_MISSING_SUBSECTIONS_TEMPLATE", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 410, "line_end": 413, "source_expr": "REFLECT_DIAGNOSIS_MISSING_SUBSECTIONS_TEMPLATE", "edit": {"ok": true, "mode": "constant", "key": "src~adda~_src~prompts~agent_prompts.py:410-413", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 410, "line_end": 413}}, {"text": "Implementer wrote a response but never started a `## Report` block. Likely the instruction format was ignored.", "constant": "REFLECT_DIAGNOSIS_NO_REPORT_HEADING", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 430, "line_end": 434, "source_expr": "REFLECT_DIAGNOSIS_NO_REPORT_HEADING", "edit": {"ok": true, "mode": "constant", "key": "src~adda~_src~prompts~agent_prompts.py:430-434", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 430, "line_end": 434}}]}, {"id": "reproduction", "title": "Reproduction gate", "kind": "hard", "phase": "Done() + RunNotebook(gate=True)", "module": "nodes/reproduction_gate.py", "symbol": "ReproductionGateMixin._reproduction_gate", "effect": "pipeline.ipynb must execute cleanly, add zero oracle rows and rewrite none.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 92, "signature": "ReproductionGateMixin._reproduction_gate", "match": "symbol", "span": false, "done_order": null, "messages": [{"text": "Canonical store has no rows — the campaign has not been evaluated yet. Run the delegation pipeline first so the ledger is populated, then the notebook can be reproduced lazily against those rows.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 231, "line_end": 234, "source_expr": "\"Canonical store has no rows — the campaign has not been \"\n                \"evaluated yet. Run the delegation pipeline first so the \"\n                \"ledger is populated, then the notebook can be reproduced \"\n                \"lazily against those rows.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~reproduction_gate.py:231-234", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 231, "line_end": 234}}, {"text": "{deliverable.name} did not finish within {_timeout}s. A reproduction must be lightweight — load the ledger and skip finished evals and heavy refits (cache-or-load surrogates). Make it lazy.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 269, "line_end": 272, "source_expr": "f\"{deliverable.name} did not finish within {_timeout:.0f}s. A \"\n                    \"reproduction must be lightweight — load the ledger and skip \"\n                    \"finished evals and heavy refits (cache-or-load surrogates). \"\n                    \"Make it lazy.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~reproduction_gate.py:269-272", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 269, "line_end": 272}}, {"text": "{deliverable.name} is NOT lazy: re-running it changed the ledger row count ({before_n} → {after_n}). It must LOAD the ledger (ExperimentData.from_file) and reach the oracle only via get_evaluator() so FINISHED rows are skipped — zero new evals.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 288, "line_end": 291, "source_expr": "f\"{deliverable.name} is NOT lazy: re-running it changed the ledger row \"\n                f\"count ({before_n} → {after_n}). It must LOAD the ledger \"\n                \"(ExperimentData.from_file) and reach the oracle only via \"\n                \"get_evaluator() so FINISHED rows are skipped — zero new evals.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~reproduction_gate.py:288-291", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 288, "line_end": 291}}, {"text": "{deliverable.name} MODIFIED existing ledger rows. A reproduction must read the ledger READ-ONLY (it may re-store identical rows, but must not rewrite values or delete+re-add). Do not tamper with the canonical store.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 295, "line_end": 298, "source_expr": "f\"{deliverable.name} MODIFIED existing ledger rows. A reproduction must \"\n                \"read the ledger READ-ONLY (it may re-store identical rows, but \"\n                \"must not rewrite values or delete+re-add). Do not tamper with \"\n                \"the canonical store.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~reproduction_gate.py:295-298", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 295, "line_end": 298}}]}, {"id": "deliverables", "title": "Required deliverables present", "kind": "hard", "phase": "Done() + RunNotebook(gate=True)", "module": "nodes/reproduction_gate.py", "symbol": "ReproductionGateMixin._missing_deliverables", "effect": "Names any required deliverable that is absent.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 54, "signature": "ReproductionGateMixin._missing_deliverables", "match": "symbol", "span": false, "done_order": null, "messages": []}, {"id": "supported", "title": "SUPPORTED needs an attempt", "kind": "hard", "phase": "HypothesisUpdate()", "module": "nodes/tools/routing/ledger.py", "symbol": "LedgerTools._supported_needs_attempt", "effect": "Refused synchronously at the data boundary.", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 153, "signature": "LedgerTools._supported_needs_attempt", "match": "symbol", "span": false, "done_order": null, "messages": [{"text": "[CONFIRM] You are marking {hypothesis_id} SUPPORTED without a completed falsification attempt on record. The Popperian charter asks that a hypothesis be challenged before it is accepted — the clean path is to delegate a refutation test (is_falsification_attempt=True, hypothesis_ids=['{hypothesis_id}']), or, if one already ran unflagged, re-call with falsification_attempt=True and that delegation as evidence. If you have genuine grounds to accept it WITHOUT that, re-call HypothesisUpdate with the same status and a written justification in `comment` (a sentence on why SUPPORTED holds and how it could still be refuted) — that confirms. Falsification criterion: {crit}", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 184, "line_end": 197, "source_expr": "f\"[CONFIRM] You are marking {hypothesis_id} SUPPORTED \"\n                \"without a completed falsification attempt on record. \"\n                \"The Popperian charter asks that a hypothesis be \"\n                \"challenged before it is accepted — the clean path is \"\n                \"to delegate a refutation test \"\n                \"(is_falsification_attempt=True, \"\n                f\"hypothesis_ids=['{hypothesis_id}']), or, if one already \"\n                \"ran unflagged, re-call with falsification_attempt=True \"\n                \"and that delegation as evidence. If you \"\n                \"have genuine grounds to accept it WITHOUT that, re-call \"\n                \"HypothesisUpdate with the same status and a written \"\n                \"justification in `comment` (a sentence on why SUPPORTED \"\n                \"holds and how it could still be refuted) — that \"\n                f\"confirms. Falsification criterion: {crit!r}\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~ledger.py:184-197", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 184, "line_end": 197}}]}, {"id": "unledgered", "title": "Unledgered evaluations", "kind": "soft", "phase": "continuous", "module": "epistemics/science_monitor.py", "symbol": "ScienceMonitor._check_unledgered", "effect": "Injected as an in-band notice; never blocks.", "file": "src/adda/_src/epistemics/science_monitor.py", "line": 199, "signature": "ScienceMonitor._check_unledgered", "match": "symbol", "span": false, "done_order": null, "messages": []}, {"id": "unstamped", "title": "Unstamped rows", "kind": "soft", "phase": "continuous", "module": "epistemics/science_monitor.py", "symbol": "ScienceMonitor._check_unstamped_rows", "effect": "Injected as an in-band notice; never blocks.", "file": "src/adda/_src/epistemics/science_monitor.py", "line": 103, "signature": "ScienceMonitor._check_unstamped_rows", "match": "symbol", "span": false, "done_order": null, "messages": []}, {"id": "verdict_advisory", "title": "Verdict advisory note", "kind": "soft", "phase": "HypothesisUpdate()", "module": "nodes/tools/routing/ledger.py", "symbol": "LedgerTools._verdict_advisory", "switch": "F3DASM_VERDICT_VALIDATOR", "effect": "The referee's ruling is returned as advice attached to the update.", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 298, "signature": "LedgerTools._verdict_advisory", "match": "symbol", "span": false, "done_order": null, "messages": []}], "shared": [{"name": "FALSIFICATION_CHARTER", "file": "src/adda/_src/knowledge/charter.py", "line": 42, "chars": 4498, "text": "SCIENTIFIC-METHOD CHARTER — the binding contract for testing and labelling\nhypotheses. You can cite a clause by number (\"Charter §3\"); whoever labels a\nhypothesis and whoever audits that label are bound by it alike.\n\n§1  A hypothesis is ONE falsifiable claim carrying a registered prediction —\n    the observable whose occurrence would refute the claim.\n\n§2  ATTEMPT and VERDICT are distinct. Before a hypothesis may be closed, an\n    adequate falsification ATTEMPT must have been made — a SEVERE test: one that\n    genuinely probes the registered prediction and could have refuted the claim\n    had it been false (a token probe is not adequate). Adequacy is a property of\n    the test's SEVERITY, never of a label: tag such a delegation\n    is_falsification_attempt so the attempt is auditable, but the tag only\n    RECORDS the attempt — it cannot make a weak test adequate, nor a severe\n    untagged one inadequate. The VERDICT is a separate judgement that follows\n    the test's OUTCOME — never the mere fact that an attempt was run.\n    For a prediction whose refutation turns on FINDING an instance — an\n    achievement or existence claim (\"some design in this space reaches X\"), or\n    its negation (\"no design reaches X\") — severity means the search had the\n    POWER to find that instance had it existed; concretely, that had a\n    qualifying instance existed in the space the claim ranges over, the search\n    would very probably have found it. HOW you argue the\n    search had that power is open and judged on its merits — adequate coverage\n    of the space (dense/near-exhaustive sampling, credible in low dimension), a\n    guiding surrogate that predicts the claim's OWN observable above chance\n    (needed as dimension grows, where coverage alone cannot suffice), a\n    theoretical bound, or a combination. These are examples, not a checklist:\n    no single one is mandatory, and a surrogate for a DIFFERENT quantity never\n    counts (it does not measure the claim). A search that merely stopped\n    improving, or whose only power-argument the work itself undercuts (e.g. a\n    surrogate it reports as near-chance with no coverage argument to stand on),\n    is an INADEQUATE test of such a claim and routes to INCONCLUSIVE under §3 —\n    failing to find a better instance is not the same as showing none exists.\n\n§3  A hypothesis is FALSIFIED if and only if an ADEQUATE test (§2) of its\n    registered prediction yields a contradiction. Concretely:\n      - adequate test, prediction contradicted     -> FALSIFIED (you may not\n        decline the verdict to protect a favoured claim);\n      - adequate test, prediction NOT contradicted -> the hypothesis SURVIVED\n        and is therefore SUPPORTED (§5) — corroborated, not proven; it is NOT\n        falsified, even if other evidence makes it look wrong;\n      - inadequate or confounded test              -> INCONCLUSIVE. A\n        contradiction from a flawed test indicts the test, not the hypothesis\n        (Duhem–Quine).\n    INCONCLUSIVE is reserved for an inadequate test; a hypothesis that has had\n    no adequate test yet is simply OPEN. To sum up, the hypotheses should,\n    at all points, be logically self-consistent given the evidence (i.e. no\n    subset is contradictory).\n\n§4  No moving the goalposts. A FALSIFIED verdict must rest on the contradiction\n    of the SAME prediction that was registered — not a different, post-hoc\n    observation chosen after seeing the data (the Texas-sharpshooter fallacy).\n    If the registered prediction was the wrong test, revise it explicitly and\n    run a new adequate test; do not reinterpret the old result.\n\n§5  SUPPORTED is corroboration, not proof. It means the hypothesis survived at\n    least one adequate attempt to refute it (§2–§3). You never \"confirm\" a\n    hypothesis; you only fail to falsify it.\n\n§6  The four statuses are the only ones: OPEN, SUPPORTED, FALSIFIED,\n    INCONCLUSIVE. OPEN = no adequate test yet; the other three are closing\n    statuses and must cite a real delegation ID plus a CONCRETE result from\n    that delegation that bears on the registered prediction — a measurement, a\n    category, a pass/fail, or a comparison (whatever form the prediction takes;\n    not all evidence is numeric — a qualitative observation that contradicts a\n    risky prediction falsifies it just as a black swan refutes \"all swans are\n    white\"). What is forbidden is closing on prose or vibes: the cited result\n    must be specific and checkable against the prediction.\n"}, {"name": "F3DASM_CORE_IDIOMS", "file": "src/adda/_src/knowledge/idioms.py", "line": 17, "chars": 4778, "text": "VERIFIED f3dasm DATA IDIOMS (CI-checked against the installed f3dasm —\ntrust these over any remembered signature):\n\n    from f3dasm import ExperimentData, ExperimentSample, create_sampler\n    from f3dasm.design import Domain\n    import numpy as np\n\n    # Domain: one add_float per continuous input, one add_output per output.\n    domain = Domain()\n    for name in (\"x1\", \"x2\"):\n        domain.add_float(name, -5.0, 5.0)\n    domain.add_output(\"y\")\n\n    # Space-filling sample: create_sampler() returns a Block; call it ON an\n    # ExperimentData. There is NO data.sample(...) method.\n    data = ExperimentData(domain=domain)\n    sampler = create_sampler(\"latin_sampler\", seed=0)   # or \"random_sampler\"\n    data = sampler.call(data=data, n_samples=8)\n\n    # Read arrays: to_numpy() takes NO argument and returns (X, y) as a tuple.\n    # NOT data.to_numpy(\"input\"). Use X, y = ... (or _, y = ... to discard X).\n    X, y = data.to_numpy()\n    # to_pandas() returns a (input_df, output_df) TUPLE — NOT a single frame.\n    # Unpack it: df_in, df_out = data.to_pandas(). The output_df carries METADATA\n    # columns (_delegation_id, _source, _ts, _wall_ms) alongside the outputs, so\n    # df_out[col].astype(float) FAILS on those. For analysis / surrogate fitting,\n    # always use data.to_numpy() — it strips metadata and returns clean float\n    # arrays. Never use df_out[col].astype(float).\n\n    # Wrap proposed candidate points (e.g. from an acquisition function) into\n    # evaluatable ExperimentData. There is NO ExperimentData.from_numpy; build\n    # ExperimentSamples (kwarg is _input_data, NOT input) then from_data:\n    candidates = np.array([[1.0, 2.0], [3.0, -1.0]])\n    samples = {\n        i: ExperimentSample(\n            _input_data={n: float(candidates[i, j])\n                         for j, n in enumerate(domain.input_names) const LAYER_COLOR = {preamble:"#4a7fa5", system:"#1e5f8f", deliverable:"#6f8f4f", catalog:"#8a6a3d"};

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const num = n => n.toLocaleString("en-US");
const srcOf = s => !s ? "—"

/* What each citation is allowed to claim. The map never shows a line range it
   did not verify, so the kind of match is part of the citation, not a detail. */
const MATCH_NOTE = {
  exact:  "This whole block is one verbatim run of characters at these lines.",
  ast:    "Span read off the syntax tree \u2014 the constant's real first and last line.",
  lines:  "The source breaks this literal across lines (a \\ continuation, or two literals joined), so it cannot be found as one string. These are the first and last of its lines that were matched verbatim.",
  line:   "An ANCHOR, not a span: only one line of this block could be matched verbatim, and this is where that line sits.",
  tag:    "An ANCHOR: the block itself was not found, so this is where its opening tag is written.",
  docstring: "The docstring literal this entry is rendered from \u2014 these are its first and last lines in the source.",
  message: "The returned expression this text comes from \u2014 its own first and last lines in the gate's body. Braces mark values formatted in at run time; angle brackets a whole variable concatenated in.",
  literal: "The string literal that HOLDS this text \u2014 the text is a stretch inside it, so the citation is the literal's own first and last lines.",
  symbol: "The code that BUILDS this text, resolved by name on the syntax tree. The text itself is computed at run time, not written here.",
};
