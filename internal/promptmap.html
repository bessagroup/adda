edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~knowledge~f3dasm_api.py:990-1020", "file": "src/adda/_src/knowledge/f3dasm_api.py", "line": 990, "line_end": 1020}, "doc": "Look up the INSTALLED f3dasm's API — signature, docstring, source.\n\nIntrospected from the package this run executes against, so it cannot\nbe out of date. Use it before guessing any f3dasm name or argument.\n\nTwo steps, like a reference. A DESCRIPTION returns a menu: one line per\nmatching symbol, up to `limit`. A NAME from that menu returns its entry:\nthe import line to write, the full signature, and the docstring.\n  ConsultF3dasm(\"sample the design space\")   # menu\n  ConsultF3dasm(\"f3dasm.create_sampler\")     # entry\n  ConsultF3dasm(\"f3dasm.create_sampler\", source=True)\nAdd source=True only when the docstring does not settle the question.\n\nSearch is LEXICAL — your words against symbol names (weighted heavily)\nand docstrings; singular/plural and sampler/sampling are folded. Give\nthe real name when you know it, otherwise f3dasm's own vocabulary\n(\"sample\", \"store\", \"optimize\", \"domain\"). A traceback's private path\nresolves to its public symbol.\n\nThree things no other source gives you:\n  - The PUBLIC import path. f3dasm defines its classes under\n    f3dasm._src.*, which is NOT what you import; the entry gives the\n    line to write.\n  - PRIVATE marks an internal symbol: read it to understand a\n    traceback, never import it.\n  - Where adda REPLACES an f3dasm method at runtime, the entry says so\n    and describes what actually executes.\n\nCovers the installed f3dasm only — not your study code and not other\nlibraries, so a miss means \"not an f3dasm symbol\", not \"does not exist\"."}, {"tag": null, "label": "ConsultHandbook", "chars": 459, "text": "### ConsultHandbook\nConsultHandbook tool: browse the curated handbook of project conventions.\n\nCall with NO argument to get the table of contents (every chapter's id +\ntitle). Pass a chapter id (e.g. \"falsification-charter\") to read that one\nchapter in full. Pass free-text keywords to search when you don't know the\nid. Read-only and best-effort — never raises into the agent loop.\nExamples:\n  - ConsultHandbook()\n  - ConsultHandbook('falsification-charter')", "source": {"file": "src/adda/_src/nodes/parsing.py", "line": 251, "line_end": 257, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~parsing.py:251-257", "file": "src/adda/_src/nodes/parsing.py", "line": 251, "line_end": 257}, "doc": "ConsultHandbook tool: browse the curated handbook of project conventions.\n\nCall with NO argument to get the table of contents (every chapter's id +\ntitle). Pass a chapter id (e.g. \"falsification-charter\") to read that one\nchapter in full. Pass free-text keywords to search when you don't know the\nid. Read-only and best-effort — never raises into the agent loop."}, {"tag": null, "label": "ConsultLiterature", "chars": 801, "text": "### ConsultLiterature\nRead the study's literature corpus. It is shared across every run\nof the study, so it may already hold a prior run's answer — look here\nbefore searching the databases again.\n\nNo argument → what is in it: every paper with its paper_id, each\ntagged [full-text] or [abstract-only] so you know which you may quote\nfrom. A paper_id from that list → the full extracted, page-annotated\ntext of that paper. Anything else → passage search across the\nfull-text papers, best match first, up to `limit`.\n\nPapers enter the corpus only when the literature reviewer adds them;\na search over a corpus with no full-text papers says so.\nExamples:\n  - ConsultLiterature()\n  - ConsultLiterature('lattice buckling under axial compression', limit=5)\n  - ConsultLiterature('<a paper_id from the list>')", "source": {"file": "src/adda/_src/agents/literature_tools/corpus.py", "line": 114, "line_end": 125, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~agents~literature_tools~corpus.py:114-125", "file": "src/adda/_src/agents/literature_tools/corpus.py", "line": 114, "line_end": 125}, "doc": "Read the study's literature corpus. It is shared across every run\nof the study, so it may already hold a prior run's answer — look here\nbefore searching the databases again.\n\nNo argument → what is in it: every paper with its paper_id, each\ntagged [full-text] or [abstract-only] so you know which you may quote\nfrom. A paper_id from that list → the full extracted, page-annotated\ntext of that paper. Anything else → passage search across the\nfull-text papers, best match first, up to `limit`.\n\nPapers enter the corpus only when the literature reviewer adds them;\na search over a corpus with no full-text papers says so."}, {"tag": null, "label": "Delegate", "chars": 931, "text": "### Delegate\nFire a task to a connected agent.\n\nhypothesis_ids should be a list, e.g. hypothesis_ids=['H1','H2'] — a\nstring is accepted too (JSON/Python-repr/comma-joined/bare) and\ndecoded the same way, defensively, for a model that emits one.\n\nReplaced per node by :meth:`delegate_doc`, which appends this node's\nown connected targets. This text is the fallback when a node is built\nwithout a graph spec (tests).\nExamples:\n  - Delegate('implementer', 'Run a 50-pt Latin sweep of t/L in [0.02,0.20]; evaluate via get_evaluator(); report top-5 by buckling_load_norm + the results CSV path + feasible count.', 'top-5 t/L, their values, CSV path, n feasible', hypothesis_ids=['H1','H2'])\n  - Delegate('implementer', 'Falsification probe: dense grid n=20 of t/L in [0.10,0.14]; does any point beat buckling_load_norm 1.47?', 'best value in range + pass/fail', hypothesis_ids=['H1'], is_falsification_attempt=True, phase='optimization')", "source": {"file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 1633, "line_end": 1642, "match": "docstring", "span": true}, "edit": {"ok": false, "why": "This tool's description is rebuilt for each node at dispatch — it embeds that node's own connections — so what the agent reads is not what the source says. Edit the builder in nodes/tools/routing/, not this text."}, "doc": "Fire a task to a connected agent.\n\nhypothesis_ids should be a list, e.g. hypothesis_ids=['H1','H2'] — a\nstring is accepted too (JSON/Python-repr/comma-joined/bare) and\ndecoded the same way, defensively, for a model that emits one.\n\nReplaced per node by :meth:`delegate_doc`, which appends this node's\nown connected targets. This text is the fallback when a node is built\nwithout a graph spec (tests)."}, {"tag": null, "label": "Done", "chars": 1419, "text": "### Done\nSignal end of run with a summary of findings (two-shot).\n\nCall only when: a best design is in hand with numerical support from\nReports; at least one falsification attempt has been carried out; every\nPRIMARY success criterion is MET (an INCONCLUSIVE/unmet one is not — run\nthe affordable experiment that would settle it if budget remains); and\nthe deliverable has been authored.\nsummary should state the best design + supporting numbers + the\nfalsification outcome + remaining uncertainty + (if closing with budget\nleft) why the remaining budget cannot settle any unmet criterion.\n\nThe VERY FIRST Done() call of the run issues a one-time WARNING and\ndoes NOT close; call it again to confirm. That confirm is once per\nRUN, not once per attempt — a later call (e.g. after a critic\nREVISE/REJECT, or a retry after fixing something) proceeds straight\nto the real gates below, no repeat warning. Any open hypotheses or\ndangling falsification attempts are reported on EVERY call where\nthey are still true, independent of that one-time warning.\n\nRefused if any delegation is still Working — collect every\npending delegation with Wait first. (A delegation you launched\nwait=True would already be collected here, with no pending poll.)\nExamples:\n  - Done(summary='Best design x=0.31 → f=1.47 (D006). H1 SUPPORTED after its falsification attempt (D007); 140 of 300 evals spent; residual risk: an unsampled narrow basin.')", "source": {"file": "src/adda/_src/nodes/tools/routing/feedback.py", "line": 98, "line_end": 120, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~feedback.py:98-120", "file": "src/adda/_src/nodes/tools/routing/feedback.py", "line": 98, "line_end": 120}, "doc": "Signal end of run with a summary of findings (two-shot).\n\nCall only when: a best design is in hand with numerical support from\nReports; at least one falsification attempt has been carried out; every\nPRIMARY success criterion is MET (an INCONCLUSIVE/unmet one is not — run\nthe affordable experiment that would settle it if budget remains); and\nthe deliverable has been authored.\nsummary should state the best design + supporting numbers + the\nfalsification outcome + remaining uncertainty + (if closing with budget\nleft) why the remaining budget cannot settle any unmet criterion.\n\nThe VERY FIRST Done() call of the run issues a one-time WARNING and\ndoes NOT close; call it again to confirm. That confirm is once per\nRUN, not once per attempt — a later call (e.g. after a critic\nREVISE/REJECT, or a retry after fixing something) proceeds straight\nto the real gates below, no repeat warning. Any open hypotheses or\ndangling falsification attempts are reported on EVERY call where\nthey are still true, independent of that one-time warning.\n\nRefused if any delegation is still Working — collect every\npending delegation with Wait first. (A delegation you launched\nwait=True would already be collected here, with no pending poll.)"}, {"tag": null, "label": "HypothesisList", "chars": 294, "text": "### HypothesisList\nList hypotheses.\n\nNo argument → every hypothesis, one line each: id, status, belief,\nstatement. With `hypothesis_ids` (a list, or a single id) → the FULL\nentry of each named hypothesis, including its status_log.\nExamples:\n  - HypothesisList()\n  - HypothesisList(['H1', 'H3'])", "source": {"file": "src/adda/_src/nodes/tools/routing/store.py", "line": 383, "line_end": 387, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~store.py:383-387", "file": "src/adda/_src/nodes/tools/routing/store.py", "line": 383, "line_end": 387}, "doc": "List hypotheses.\n\nNo argument → every hypothesis, one line each: id, status, belief,\nstatement. With `hypothesis_ids` (a list, or a single id) → the FULL\nentry of each named hypothesis, including its status_log."}, {"tag": null, "label": "HypothesisPropose", "chars": 606, "text": "### HypothesisPropose\nPropose a hypothesis. Returns its ID (H1, H2, …) or ERROR.\n\nstatement: ONE falsifiable claim (no compound claims).\nfalsification_criterion: what observation would kill it.\nprediction: the measurable outcome you expect.\nprior: plausibility in (0, 1). Past 3 OPEN you are asked to\nconfirm (re-submit the same proposal) rather than blocked —\ntracking several at once is fine, e.g. one per design.\nExamples:\n  - HypothesisPropose('Optimal t/L is near 0.08 — thin walls maximise buckling', 'a point with t/L in [0.10,0.14] beats buckling_load_norm 1.47', 'best at t/L ~ 0.08 ± 0.02', 0.55)", "source": {"file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 56, "line_end": 63, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~ledger.py:56-63", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 56, "line_end": 63}, "doc": "Propose a hypothesis. Returns its ID (H1, H2, …) or ERROR.\n\nstatement: ONE falsifiable claim (no compound claims).\nfalsification_criterion: what observation would kill it.\nprediction: the measurable outcome you expect.\nprior: plausibility in (0, 1). Past 3 OPEN you are asked to\nconfirm (re-submit the same proposal) rather than blocked —\ntracking several at once is fine, e.g. one per design."}, {"tag": null, "label": "HypothesisUpdate", "chars": 1782, "text": "### HypothesisUpdate\nUpdate hypothesis status with evidence and updated belief.\n\nstatus: OPEN | SUPPORTED | FALSIFIED | INCONCLUSIVE.\nposterior: your updated belief in [0, 1] — always required.\nevidence: {\"delegation\": \"D###\", \"numbers\": {key: value}}\n  required for closing statuses; numbers should cite values\n  from that delegation's report.\nSUPPORTED requires a completed falsification attempt targeting\n  this hypothesis first — Delegate(..., is_falsification_attempt=True,\n  hypothesis_ids=[hypothesis_id]) and wait for it to complete.\nRETRACTING SUPPORTED/INCONCLUSIVE back to OPEN (e.g. you marked it\n  SUPPORTED but no falsification ATTEMPT was made — Charter §2) needs\n  NO new evidence: pass evidence=None and explain in the comment; the\n  evidence the verdict was based on is carried forward. Use this to\n  fix your own premature close instead of leaving a contradiction.\n  (Un-falsifying a FALSIFIED hypothesis still needs new evidence — it\n  is a new claim, not a retraction.)\nfalsification_attempt=True: the cited delegation genuinely tested\n  this hypothesis's registered prediction but was not flagged as an\n  attempt when it was delegated. It is linked as one before the\n  verdict is recorded. Only a delegation that STARTED after the\n  hypothesis was registered can be linked — one that began earlier\n  cannot have been designed to test it.\ntriggered_by is auto-injected from last completed\ndelegation.\nExamples:\n  - HypothesisUpdate('H1', 'SUPPORTED', 'sweep top t/L=0.09 beats threshold', 0.80, evidence={'delegation': 'D001', 'numbers': {'top_tL': 0.09, 'buckling_load_norm': 1.47}})\n  - HypothesisUpdate('H2', 'FALSIFIED', 'probe at predicted optimum fell short', 0.10, evidence={'delegation': 'D004', 'numbers': {'f_best': 0.62}}, falsification_attempt=True)", "source": {"file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 92, "line_end": 116, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~ledger.py:92-116", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 92, "line_end": 116}, "doc": "Update hypothesis status with evidence and updated belief.\n\nstatus: OPEN | SUPPORTED | FALSIFIED | INCONCLUSIVE.\nposterior: your updated belief in [0, 1] — always required.\nevidence: {\"delegation\": \"D###\", \"numbers\": {key: value}}\n  required for closing statuses; numbers should cite values\n  from that delegation's report.\nSUPPORTED requires a completed falsification attempt targeting\n  this hypothesis first — Delegate(..., is_falsification_attempt=True,\n  hypothesis_ids=[hypothesis_id]) and wait for it to complete.\nRETRACTING SUPPORTED/INCONCLUSIVE back to OPEN (e.g. you marked it\n  SUPPORTED but no falsification ATTEMPT was made — Charter §2) needs\n  NO new evidence: pass evidence=None and explain in the comment; the\n  evidence the verdict was based on is carried forward. Use this to\n  fix your own premature close instead of leaving a contradiction.\n  (Un-falsifying a FALSIFIED hypothesis still needs new evidence — it\n  is a new claim, not a retraction.)\nfalsification_attempt=True: the cited delegation genuinely tested\n  this hypothesis's registered prediction but was not flagged as an\n  attempt when it was delegated. It is linked as one before the\n  verdict is recorded. Only a delegation that STARTED after the\n  hypothesis was registered can be linked — one that began earlier\n  cannot have been designed to test it.\ntriggered_by is auto-injected from last completed\ndelegation."}, {"tag": null, "label": "MilestoneList", "chars": 297, "text": "### MilestoneList\nList process milestones with id, status, description.\n\nMilestones are PROCESS steps (do X before Y; get Z ready), distinct\nfrom hypotheses (epistemics). Default milestones self-resolve when\ntheir condition is met; you add your own with MilestoneSet.\nExamples:\n  - MilestoneList()", "source": {"file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 392, "line_end": 396, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~ledger.py:392-396", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 392, "line_end": 396}, "doc": "List process milestones with id, status, description.\n\nMilestones are PROCESS steps (do X before Y; get Z ready), distinct\nfrom hypotheses (epistemics). Default milestones self-resolve when\ntheir condition is met; you add your own with MilestoneSet."}, {"tag": null, "label": "MilestoneSet", "chars": 884, "text": "### MilestoneSet\nAdd a process milestone, or close one.\n\nADD: no milestone_id, a `description` → returns its id (M1, M2, …).\nWhile pending it joins the backlog that gates delegating to the\nimplementer, exactly like the default milestones — so use it to hold\nyourself to a process step you don't want to skip.\n\nCLOSE: milestone_id + status DONE or SKIPPED + a `note`. The note is\nREQUIRED — one line on WHY it is satisfied (what was done, which\ndelegation) or why this study legitimately does not need it — so\nclosing is a deliberate, auditable act, not a rubber stamp. SKIPPED is\nthe escape hatch that keeps soft gates from ever deadlocking you.\nExamples:\n  - MilestoneSet(description='oracle validated on one sample before any campaign')\n  - MilestoneSet('M2', 'DONE', note='D003 validated the oracle')\n  - MilestoneSet('M4', 'SKIPPED', note='no literature exists for this geometry')", "source": {"file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 415, "line_end": 426, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~ledger.py:415-426", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 415, "line_end": 426}, "doc": "Add a process milestone, or close one.\n\nADD: no milestone_id, a `description` → returns its id (M1, M2, …).\nWhile pending it joins the backlog that gates delegating to the\nimplementer, exactly like the default milestones — so use it to hold\nyourself to a process step you don't want to skip.\n\nCLOSE: milestone_id + status DONE or SKIPPED + a `note`. The note is\nREQUIRED — one line on WHY it is satisfied (what was done, which\ndelegation) or why this study legitimately does not need it — so\nclosing is a deliberate, auditable act, not a rubber stamp. SKIPPED is\nthe escape hatch that keeps soft gates from ever deadlocking you."}, {"tag": null, "label": "OracleStatus", "chars": 722, "text": "### OracleStatus\nThe CURRENT canonical oracle registration — reads\nrun_config.json fresh on every call, never from memory of an\nearlier notification. Call this before asserting anything about\n\"the registered entrypoint\" (e.g. in a delegation brief):\nregister_evaluator_entrypoint() can repoint it BETWEEN\ndelegations — a datagenerator delegation that authors/extends\nthe generator repoints the canonical entrypoint the moment its\nreport is processed — and trusting a stale assumption here has\nalready cost one wasted real evaluation job (a delegation\nsilently exercising the wrong generator, caught only by an\nagent noticing bit-identical outputs across differing inputs;\nrun 20260717T014507).\nExamples:\n  - OracleStatus()", "source": {"file": "src/adda/_src/nodes/tools/routing/store.py", "line": 237, "line_end": 248, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~store.py:237-248", "file": "src/adda/_src/nodes/tools/routing/store.py", "line": 237, "line_end": 248}, "doc": "The CURRENT canonical oracle registration — reads\nrun_config.json fresh on every call, never from memory of an\nearlier notification. Call this before asserting anything about\n\"the registered entrypoint\" (e.g. in a delegation brief):\nregister_evaluator_entrypoint() can repoint it BETWEEN\ndelegations — a datagenerator delegation that authors/extends\nthe generator repoints the canonical entrypoint the moment its\nreport is processed — and trusting a stale assumption here has\nalready cost one wasted real evaluation job (a delegation\nsilently exercising the wrong generator, caught only by an\nagent noticing bit-identical outputs across differing inputs;\nrun 20260717T014507)."}, {"tag": null, "label": "QueryStore", "chars": 2988, "text": "### QueryStore\nThe run's canonical evaluation store. Read-only; does NOT spend\neval budget.\n\nWith NO arguments: a summary — rows per delegation and source, output\nranges, and the evaluation budget spent and remaining — one block per\nexperiment (the baseline store is 'default'; each design namespace by\nits registered name). Call it before deciding the next delegation, and\nat report time to DERIVE eval counts for the writeup and hypothesis\nevidence instead of copying a number from a plan or a worker's notes\n(those drift from what actually landed in the store). Output ends with\nthe run total, e.g.::\n\n    — run total: 140 of 300 eval budget spent — 160 remaining\n\nWith any argument: a filtered view of the rows (e.g. rows from\nD001+D003 only). Use to ground claims or to select training subsets;\ncite row values from here as evidence.\n\ncolumns narrows which COLUMNS are shown (the same idea as where=/\nlimit= narrowing which ROWS are shown) — e.g.\ncolumns=[\"f\", \"feasible\", \"margin\"]. Without it every column is\nshown for every matching row, which can overflow the response\ntoken limit on a wide store even after where=/limit= has already\nnarrowed the rows down to a handful — narrow both when a store\nhas many columns. `_namespace` is always kept regardless of\ncolumns=, per the invariant above. A requested column that\ndoesn't exist returns an ERROR string listing the available\ncolumns; it never raises.\n\nEvery row is tagged with a `_namespace` column (\"default\" for the\nbaseline study, or the design-namespace name for a row that landed\nin an experiment opened via Delegate(namespace=...)) — this is\nALWAYS shown, not just when filtering, since a namespace row can\notherwise look indistinguishable from a baseline row (e.g. a\nnear-identical value with a different mechanism). Pass namespace=\nto restrict to one store; note `source=` is NOT this — it filters\nthe `_source` provenance column (the study name, identical across\nevery namespace), so it can never disambiguate namespaces.\n\nn_best returns the best rows by output_name: smallest when\nminimize=True (default), largest when minimize=False (set this for\nMAXIMIZATION objectives). Infeasible/placeholder rows (large-\nmagnitude sentinel outputs) are never returned as 'best'.\n\nwhere is a pandas query() expression over the JOINED inputs+outputs\nframe, for a compound feasibility predicate in one call — e.g.\nwhere=\"feasible==1 and margin>=0.10 and stress_ratio<=1.0\".\nArithmetic on input columns works too, so a derived quantity needs\nno stored column: where=\"x2/(2*x1) >= 10\". Combine with n_best to\nrank the feasible subset. A bad expression returns an ERROR string\nlisting the available columns; it never raises.\n\nlimit caps the default (non-n_best) listing (default 20); raise it to\npull a larger feasible set once where= has narrowed the rows.\nExamples:\n  - QueryStore()\n  - QueryStore(where='feasible==1 and margin>=0.10', n_best=5, output_name='f')\n  - QueryStore(delegation_ids=['D003'], columns=['x1', 'f'], limit=50)", "source": {"file": "src/adda/_src/nodes/tools/routing/store.py", "line": 296, "line_end": 349, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~store.py:296-349", "file": "src/adda/_src/nodes/tools/routing/store.py", "line": 296, "line_end": 349}, "doc": "The run's canonical evaluation store. Read-only; does NOT spend\neval budget.\n\nWith NO arguments: a summary — rows per delegation and source, output\nranges, and the evaluation budget spent and remaining — one block per\nexperiment (the baseline store is 'default'; each design namespace by\nits registered name). Call it before deciding the next delegation, and\nat report time to DERIVE eval counts for the writeup and hypothesis\nevidence instead of copying a number from a plan or a worker's notes\n(those drift from what actually landed in the store). Output ends with\nthe run total, e.g.::\n\n    — run total: 140 of 300 eval budget spent — 160 remaining\n\nWith any argument: a filtered view of the rows (e.g. rows from\nD001+D003 only). Use to ground claims or to select training subsets;\ncite row values from here as evidence.\n\ncolumns narrows which COLUMNS are shown (the same idea as where=/\nlimit= narrowing which ROWS are shown) — e.g.\ncolumns=[\"f\", \"feasible\", \"margin\"]. Without it every column is\nshown for every matching row, which can overflow the response\ntoken limit on a wide store even after where=/limit= has already\nnarrowed the rows down to a handful — narrow both when a store\nhas many columns. `_namespace` is always kept regardless of\ncolumns=, per the invariant above. A requested column that\ndoesn't exist returns an ERROR string listing the available\ncolumns; it never raises.\n\nEvery row is tagged with a `_namespace` column (\"default\" for the\nbaseline study, or the design-namespace name for a row that landed\nin an experiment opened via Delegate(namespace=...)) — this is\nALWAYS shown, not just when filtering, since a namespace row can\notherwise look indistinguishable from a baseline row (e.g. a\nnear-identical value with a different mechanism). Pass namespace=\nto restrict to one store; note `source=` is NOT this — it filters\nthe `_source` provenance column (the study name, identical across\nevery namespace), so it can never disambiguate namespaces.\n\nn_best returns the best rows by output_name: smallest when\nminimize=True (default), largest when minimize=False (set this for\nMAXIMIZATION objectives). Infeasible/placeholder rows (large-\nmagnitude sentinel outputs) are never returned as 'best'.\n\nwhere is a pandas query() expression over the JOINED inputs+outputs\nframe, for a compound feasibility predicate in one call — e.g.\nwhere=\"feasible==1 and margin>=0.10 and stress_ratio<=1.0\".\nArithmetic on input columns works too, so a derived quantity needs\nno stored column: where=\"x2/(2*x1) >= 10\". Combine with n_best to\nrank the feasible subset. A bad expression returns an ERROR string\nlisting the available columns; it never raises.\n\nlimit caps the default (non-n_best) listing (default 20); raise it to\npull a larger feasible set once where= has narrowed the rows."}, {"tag": null, "label": "ReadNote", "chars": 438, "text": "### ReadNote\nRead a file — or LIST a directory — from the study directory. Use it\nto load PROBLEM_STATEMENT.md, review prior notes, and (importantly) to\nreuse the implementers' work: point it at a delegation workspace\n(workspace_dir/D###/) to LIST its files, then read the script you want\nto consolidate into pipeline.ipynb. Read what you need, not everything.\nExamples:\n  - ReadNote('PROBLEM_STATEMENT.md')\n  - ReadNote('workspace/D004')", "source": {"file": "src/adda/_src/nodes/tools/routing/notes.py", "line": 46, "line_end": 50, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~notes.py:46-50", "file": "src/adda/_src/nodes/tools/routing/notes.py", "line": 46, "line_end": 50}, "doc": "Read a file — or LIST a directory — from the study directory. Use it\nto load PROBLEM_STATEMENT.md, review prior notes, and (importantly) to\nreuse the implementers' work: point it at a delegation workspace\n(workspace_dir/D###/) to LIST its files, then read the script you want\nto consolidate into pipeline.ipynb. Read what you need, not everything."}, {"tag": null, "label": "ReadProblemStatement", "chars": 359, "text": "### ReadProblemStatement\nThe run's PROBLEM_STATEMENT.md verbatim: what this run is\nactually trying to establish, and its stated success/termination\ncriteria. Call this whenever a\ndelegation's own brief doesn't make clear what the run as a whole\nis for, or before judging whether a result actually satisfies\nwhat was asked.\nExamples:\n  - ReadProblemStatement()", "source": {"file": "src/adda/_src/nodes/tools/routing/store.py", "line": 415, "line_end": 420, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~store.py:415-420", "file": "src/adda/_src/nodes/tools/routing/store.py", "line": 415, "line_end": 420}, "doc": "The run's PROBLEM_STATEMENT.md verbatim: what this run is\nactually trying to establish, and its stated success/termination\ncriteria. Call this whenever a\ndelegation's own brief doesn't make clear what the run as a whole\nis for, or before judging whether a result actually satisfies\nwhat was asked."}, {"tag": null, "label": "ReportEvals", "chars": 329, "text": "### ReportEvals\nReport the total ground-truth evaluations you performed this\ntask. Call once per task, ALWAYS — even if 0. When you use\nget_evaluator() the canonical store is authoritative for the\ncount, but this call also ARMS the unledgered-evals safety check,\nso never skip it.\nExamples:\n  - ReportEvals(25)\n  - ReportEvals(0)", "source": {"file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 265, "line_end": 269, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~delegation.py:265-269", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 265, "line_end": 269}, "doc": "Report the total ground-truth evaluations you performed this\ntask. Call once per task, ALWAYS — even if 0. When you use\nget_evaluator() the canonical store is authoritative for the\ncount, but this call also ARMS the unledgered-evals safety check,\nso never skip it."}, {"tag": null, "label": "RunNotebook", "chars": 1154, "text": "### RunNotebook\nExecute pipeline.ipynb's cells; does NOT count toward the eval\nbudget. F3DASM_CANONICAL_STORE points at a temp COPY of the store\nwhile it runs, so the notebook's normal store-loading calls read\nthat copy. This is NOT a filesystem sandbox (see RunScratch) — the\nreal pipeline.ipynb and canonical store are hashed before/after and\nany change is reverted and reported as an ERROR, as a backstop.\n\nDefault → a PER-CELL trace: every code cell with its stdout, and the\nfirst failure with its exact traceback. `upto` (a code cell's name)\nruns top-to-bottom up to and including that cell — cells share kernel\nstate, so this pinpoints WHICH cell breaks reproduction.\n\ngate=True → the SAME reproduction gate Done() applies, as a dry run\nthat does not close the run: the notebook must run cleanly, add zero\nnew evals and leave the store unchanged, and its printed\n'REPRODUCED: <value>' headline is surfaced (the critic checks its\nprovenance). On a pass, Done()'s gate will pass. Limited to 10 per run,\nso localize a failure with the trace before re-checking the gate.\nExamples:\n  - RunNotebook()\n  - RunNotebook(upto='ml')\n  - RunNotebook(gate=True)", "source": {"file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 1076, "line_end": 1093, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~notebook.py:1076-1093", "file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 1076, "line_end": 1093}, "doc": "Execute pipeline.ipynb's cells; does NOT count toward the eval\nbudget. F3DASM_CANONICAL_STORE points at a temp COPY of the store\nwhile it runs, so the notebook's normal store-loading calls read\nthat copy. This is NOT a filesystem sandbox (see RunScratch) — the\nreal pipeline.ipynb and canonical store are hashed before/after and\nany change is reverted and reported as an ERROR, as a backstop.\n\nDefault → a PER-CELL trace: every code cell with its stdout, and the\nfirst failure with its exact traceback. `upto` (a code cell's name)\nruns top-to-bottom up to and including that cell — cells share kernel\nstate, so this pinpoints WHICH cell breaks reproduction.\n\ngate=True → the SAME reproduction gate Done() applies, as a dry run\nthat does not close the run: the notebook must run cleanly, add zero\nnew evals and leave the store unchanged, and its printed\n'REPRODUCED: <value>' headline is surfaced (the critic checks its\nprovenance). On a pass, Done()'s gate will pass. Limited to 10 per run,\nso localize a failure with the trace before re-checking the gate."}, {"tag": null, "label": "RunScratch", "chars": 1584, "text": "### RunScratch\nRun a short Python snippet and return its stdout/stderr — your\nscratchpad for INSPECTING state before committing it to\npipeline.ipynb. f3dasm and adda are importable and\nF3DASM_CANONICAL_STORE points at a temp COPY of the store, so the\nstore-loading idiom below reads that copy, not the real one, and\ndoes NOT count toward the eval budget: e.g. ``from adda import\nload_experiments; experiments = load_experiments()`` (returns every\nstore — default AND every design namespace — as ``{name:\nExperimentData}``; a bare\n``ExperimentData.from_file(os.environ['F3DASM_CANONICAL_STORE'])``\nonly sees the default store and silently misses namespace evals),\nprint best values, check a path resolves, or verify a DataFrame\npopulates.\n\nThis redirects the STORE-LOADING PATH — it is NOT a filesystem\nsandbox: the snippet is a real OS process with full filesystem\naccess, so code using an ABSOLUTE path (``os.remove``,\n``open(..., 'w')``, ``shutil.*``) still reaches the real\nexperiment_data or pipeline.ipynb. Always go through the env var /\nrelative-import idiom above, never a hardcoded run path. As a\nbackstop, not a substitute for that — the real canonical store and\npipeline.ipynb are hashed before and after every call; any change is\nreverted and reported as an ERROR here rather than left in place.\nUse it to debug instead of guessing (e.g. 'does hypotheses.json\nload? does h_dict populate?') rather than discovering a silent bug\nonly at the Done() gate.\nExamples:\n  - RunScratch(\"from adda import load_experiments; print({k: len(v) for k, v in load_experiments().items()})\")", "source": {"file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 1020, "line_end": 1045, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~notebook.py:1020-1045", "file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 1020, "line_end": 1045}, "doc": "Run a short Python snippet and return its stdout/stderr — your\nscratchpad for INSPECTING state before committing it to\npipeline.ipynb. f3dasm and adda are importable and\nF3DASM_CANONICAL_STORE points at a temp COPY of the store, so the\nstore-loading idiom below reads that copy, not the real one, and\ndoes NOT count toward the eval budget: e.g. ``from adda import\nload_experiments; experiments = load_experiments()`` (returns every\nstore — default AND every design namespace — as ``{name:\nExperimentData}``; a bare\n``ExperimentData.from_file(os.environ['F3DASM_CANONICAL_STORE'])``\nonly sees the default store and silently misses namespace evals),\nprint best values, check a path resolves, or verify a DataFrame\npopulates.\n\nThis redirects the STORE-LOADING PATH — it is NOT a filesystem\nsandbox: the snippet is a real OS process with full filesystem\naccess, so code using an ABSOLUTE path (``os.remove``,\n``open(..., 'w')``, ``shutil.*``) still reaches the real\nexperiment_data or pipeline.ipynb. Always go through the env var /\nrelative-import idiom above, never a hardcoded run path. As a\nbackstop, not a substitute for that — the real canonical store and\npipeline.ipynb are hashed before and after every call; any change is\nreverted and reported as an ERROR here rather than left in place.\nUse it to debug instead of guessing (e.g. 'does hypotheses.json\nload? does h_dict populate?') rather than discovering a silent bug\nonly at the Done() gate."}, {"tag": null, "label": "SendMessage", "chars": 1570, "text": "### SendMessage\nAsk, answer, or approve — the one tool for peer and human\nmessaging (spec 12). ``message`` is REQUIRED; empty is an error,\nnever a silent no-op. ``to`` is a delegation id (unambiguous), your\nOWN delegator's name (if you are a worker — resolved to whoever\nactually delegated to you, not looked up), or another role name —\nbut a role name matching more than one currently-running\ndelegation of that role is an ERROR naming the candidates, never a\nguess: address the specific id instead. ``wait_for_reply=True``\nblocks and returns IN THIS SAME CALL — it wakes on ANY message from\nthat peer, whichever arrives (their reply, or a fresh question of\ntheir own, labelled as what it is, not implied to answer this one),\nso two peers SendMessage-ing each other at once never both hang. If\nthe peer ends (finishes/errors) before replying, you are told that\ninstead of waiting out the full timeout. If nothing arrives before\nthe timeout (config: ``peer_message_wait_s``, default 300s), your\nmessage is NOT dropped — it stays queued and its answer, once the\npending-for-you mechanism lands, will surface in a later tool\nresult; the timeout return says so rather than reading as \"no\nreply\". ``to=\"human\"`` is offered only to the entry node — every\nother node has no direct path to a person and should route a\nhuman-worthy question through its own delegator instead.\nExamples:\n  - SendMessage('D004', 'Which surrogate is that R2=0.91 from?')\n  - SendMessage('D004', 'Approved.', approve=True)\n  - SendMessage('strategizer', 'Stopping at 40 evals.', wait_for_reply=True)", "source": {"file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 2817, "line_end": 2838, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~delegation.py:2817-2838", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 2817, "line_end": 2838}, "doc": "Ask, answer, or approve — the one tool for peer and human\nmessaging (spec 12). ``message`` is REQUIRED; empty is an error,\nnever a silent no-op. ``to`` is a delegation id (unambiguous), your\nOWN delegator's name (if you are a worker — resolved to whoever\nactually delegated to you, not looked up), or another role name —\nbut a role name matching more than one currently-running\ndelegation of that role is an ERROR naming the candidates, never a\nguess: address the specific id instead. ``wait_for_reply=True``\nblocks and returns IN THIS SAME CALL — it wakes on ANY message from\nthat peer, whichever arrives (their reply, or a fresh question of\ntheir own, labelled as what it is, not implied to answer this one),\nso two peers SendMessage-ing each other at once never both hang. If\nthe peer ends (finishes/errors) before replying, you are told that\ninstead of waiting out the full timeout. If nothing arrives before\nthe timeout (config: ``peer_message_wait_s``, default 300s), your\nmessage is NOT dropped — it stays queued and its answer, once the\npending-for-you mechanism lands, will surface in a later tool\nresult; the timeout return says so rather than reading as \"no\nreply\". ``to=\"human\"`` is offered only to the entry node — every\nother node has no direct path to a person and should route a\nhuman-worthy question through its own delegator instead."}, {"tag": null, "label": "ShowNotebook", "chars": 621, "text": "### ShowNotebook\nRead pipeline.ipynb back. NO argument → a BRIEF table of contents\nLISTING EVERY CELL BY NAME in canonical order, each with its type, rev,\nand first source line, plus which pillars are present/missing — call this\nto see what exists before editing, and to remind yourself how the\ndifferent cells are ordered.\nWith `name` (problem, hypotheses, verdict, a custom cell, a\npillar, or a '<pillar>__why' explainer) → the FULL source of that cell and\nits rev (the rev you then pass as `expected_rev` to WriteCell).\nRead-only; never creates the file; free.\nExamples:\n  - ShowNotebook()\n  - ShowNotebook('analysis')", "source": {"file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 967, "line_end": 975, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~notebook.py:967-975", "file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 967, "line_end": 975}, "doc": "Read pipeline.ipynb back. NO argument → a BRIEF table of contents\nLISTING EVERY CELL BY NAME in canonical order, each with its type, rev,\nand first source line, plus which pillars are present/missing — call this\nto see what exists before editing, and to remind yourself how the\ndifferent cells are ordered.\nWith `name` (problem, hypotheses, verdict, a custom cell, a\npillar, or a '<pillar>__why' explainer) → the FULL source of that cell and\nits rev (the rev you then pass as `expected_rev` to WriteCell).\nRead-only; never creates the file; free."}, {"tag": null, "label": "Wait", "chars": 1274, "text": "### Wait\nBlock until a delegation finishes (Done or Errored), then return its\nresult — holds the current turn open with no extra turns consumed.\n\nOMIT delegation_id to wait for whichever delegation finishes FIRST.\nThat is how you collect a fan-out: dispatch several with\nDelegate(wait=False), then call Wait() once per worker — each call\nhands back one finished delegation's report (labelled with its ID) and\nblocks only while nothing is ready. Naming an ID instead waits for that\nspecific worker, which leaves any others finishing unread, so prefer\nthe bare form whenever more than one delegation is in flight.\n\nblock=False (with a delegation_id) → do not wait: return that\ndelegation's status right now — 'Working (running for Xs, polled N\ntimes)', 'Done' + its full report, or 'Errored' + the traceback. Use it\nto read a delegation that is gone without reporting, or to check on\none while you do other work; polling it faster does not make it finish\nsooner.\n\nRefuses when there is nothing to wait for, and refuses rather than\nhanging when waiting cannot make progress — every in-flight delegation\nparked on a FollowUp (answer it with Reply), or already gone without\nreporting (read it with block=False).\nExamples:\n  - Wait()\n  - Wait('D004')\n  - Wait('D004', block=False)", "source": {"file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 2548, "line_end": 2569, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~delegation.py:2548-2569", "file": "src/adda/_src/nodes/tools/routing/delegation.py", "line": 2548, "line_end": 2569}, "doc": "Block until a delegation finishes (Done or Errored), then return its\nresult — holds the current turn open with no extra turns consumed.\n\nOMIT delegation_id to wait for whichever delegation finishes FIRST.\nThat is how you collect a fan-out: dispatch several with\nDelegate(wait=False), then call Wait() once per worker — each call\nhands back one finished delegation's report (labelled with its ID) and\nblocks only while nothing is ready. Naming an ID instead waits for that\nspecific worker, which leaves any others finishing unread, so prefer\nthe bare form whenever more than one delegation is in flight.\n\nblock=False (with a delegation_id) → do not wait: return that\ndelegation's status right now — 'Working (running for Xs, polled N\ntimes)', 'Done' + its full report, or 'Errored' + the traceback. Use it\nto read a delegation that is gone without reporting, or to check on\none while you do other work; polling it faster does not make it finish\nsooner.\n\nRefuses when there is nothing to wait for, and refuses rather than\nhanging when waiting cannot make progress — every in-flight delegation\nparked on a FollowUp (answer it with Reply), or already gone without\nreporting (read it with block=False)."}, {"tag": null, "label": "WriteCell", "chars": 1722, "text": "### WriteCell\nCreate, edit or delete ONE named cell of pipeline.ipynb.\n\n`name` is the cell: a pillar (doe, data_generation, ml, optimization,\nanalysis), its '<pillar>__why' explainer, a narrative cell — 'problem',\n'hypotheses' and 'verdict' get a canonical heading added for you — or\nany custom name (a bespoke section, appended after the standard\ncells). Cells stay in canonical order whatever the call order;\npipeline.ipynb is created if absent.\n\nCREATE (the cell does not exist yet):\n  • a CODE cell: pass `code` and `why` — the rationale markdown shown\n    above it (cite the literature; if a pillar was not run, say 'NOT\n    executed (budget)' and why). The analysis cell must derive the\n    headline from the store and print exactly 'REPRODUCED: <value>'.\n  • a MARKDOWN cell: pass `content`.\nEDIT (the cell exists):\n  • SURGICAL: `old`/`new` — literal find/replace; `old` must occur\n    EXACTLY once, so no rev is needed.\n  • FULL: `code`/`why` for a code cell or `content` for a markdown\n    cell, PLUS `expected_rev` — the rev from ShowNotebook or your last\n    write. A stale rev is rejected, so you never overwrite a cell that\n    changed since you last saw it.\nDELETE: `delete=True` + `expected_rev`. A pillar goes with its\n  explainer. Drop what you decided not to keep rather than leaving\n  dead or placeholder content.\nExamples:\n  - WriteCell('doe', why='Latin hypercube over the 3 design variables — space-filling before any surrogate.', code='data = ...')\n  - WriteCell('problem', content='Maximise the buckling load at fixed mass.')\n  - WriteCell('doe', old='n_samples=50', new='n_samples=80')\n  - WriteCell('ml', code='...', expected_rev='3f9a1c')\n  - WriteCell('ml', delete=True, expected_rev='3f9a1c')", "source": {"file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 648, "line_end": 672, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~notebook.py:648-672", "file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 648, "line_end": 672}, "doc": "Create, edit or delete ONE named cell of pipeline.ipynb.\n\n`name` is the cell: a pillar (doe, data_generation, ml, optimization,\nanalysis), its '<pillar>__why' explainer, a narrative cell — 'problem',\n'hypotheses' and 'verdict' get a canonical heading added for you — or\nany custom name (a bespoke section, appended after the standard\ncells). Cells stay in canonical order whatever the call order;\npipeline.ipynb is created if absent.\n\nCREATE (the cell does not exist yet):\n  • a CODE cell: pass `code` and `why` — the rationale markdown shown\n    above it (cite the literature; if a pillar was not run, say 'NOT\n    executed (budget)' and why). The analysis cell must derive the\n    headline from the store and print exactly 'REPRODUCED: <value>'.\n  • a MARKDOWN cell: pass `content`.\nEDIT (the cell exists):\n  • SURGICAL: `old`/`new` — literal find/replace; `old` must occur\n    EXACTLY once, so no rev is needed.\n  • FULL: `code`/`why` for a code cell or `content` for a markdown\n    cell, PLUS `expected_rev` — the rev from ShowNotebook or your last\n    write. A stale rev is rejected, so you never overwrite a cell that\n    changed since you last saw it.\nDELETE: `delete=True` + `expected_rev`. A pillar goes with its\n  explainer. Drop what you decided not to keep rather than leaving\n  dead or placeholder content."}, {"tag": null, "label": "WriteDeliverable", "chars": 354, "text": "### WriteDeliverable\nWrite an extra deliverable file that the study's config declares\n(config.yaml required_deliverables, e.g. replicate.py), verbatim, into\nthe study directory. `filename` is a bare name. The notebook is not\nwritten here — it has its own cell tools, which keep its structure.\nExamples:\n  - WriteDeliverable('replicate.py', content='...')", "source": {"file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 520, "line_end": 523, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~notebook.py:520-523", "file": "src/adda/_src/nodes/tools/routing/notebook.py", "line": 520, "line_end": 523}, "doc": "Write an extra deliverable file that the study's config declares\n(config.yaml required_deliverables, e.g. replicate.py), verbatim, into\nthe study directory. `filename` is a bare name. The notebook is not\nwritten here — it has its own cell tools, which keep its structure."}, {"tag": null, "label": "WriteNote", "chars": 444, "text": "### WriteNote\nWrite a Markdown (.md) note to strategizer_notes/ — free-form\nreasoning: why you chose each Delegate, interim findings, open issues.\nDo NOT write code in notes (embed it in Delegate().intent as plain\ntext), and do NOT record priors/posteriors here — those live ONLY in\nthe hypothesis ledger (HypothesisPropose/Update).\nExamples:\n  - WriteNote('why_D005.md', body='Chose TPE over a second LHS because the landscape is mapped: ...')", "source": {"file": "src/adda/_src/nodes/tools/routing/notes.py", "line": 19, "line_end": 23, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~notes.py:19-23", "file": "src/adda/_src/nodes/tools/routing/notes.py", "line": 19, "line_end": 23}, "doc": "Write a Markdown (.md) note to strategizer_notes/ — free-form\nreasoning: why you chose each Delegate, interim findings, open issues.\nDo NOT write code in notes (embed it in Delegate().intent as plain\ntext), and do NOT record priors/posteriors here — those live ONLY in\nthe hypothesis ledger (HypothesisPropose/Update)."}]}], "static_chars": 43814}, {"id": "literature_reviewer", "class": "LiteratureReviewAgent", "role": "literature_reviewer", "entry": false, "module": "src/adda/_src/agents/literature.py", "delegates_to": [], "tools": ["CitationGraph", "ConsultHandbook", "ConsultLiterature", "CorpusAdd", "Glob", "Grep", "PaperDetails", "Read", "ReadProblemStatement", "ReportEvals", "SearchPapers", "SendMessage"], "tool_count": 12, "layers": [{"kind": "preamble", "label": "WORKSPACE_PREAMBLE_TEMPLATE", "note": "Prepended by the runtime, in the order shown. Paths are substituted per run and stand in as placeholders; the two highlighted stretches are whole stanzas computed elsewhere, each cited to the code that builds it rather than to the template that formats it in.", "assembled_at": {"file": "src/adda/_src/runtime/agent_runtime.py", "line": 1603, "line_end": 1603, "match": "exact", "span": true}, "definition": {"file": "src/adda/_src/prompts/agent_prompts.py", "line": 278, "line_end": 316, "match": "ast", "span": true}, "chars": 4272, "sections": [{"tag": "workspace", "chars": 4272, "text": "<workspace>\nstudy_dir       = <study_dir>\ndelegation_root = <study_dir>/runs/<run_id>/debug/delegations\nYour task message contains a <workspace_subfolder>D###/</workspace_subfolder>\ntag that names the subfolder assigned exclusively to THIS delegation, under\ndelegation_root. Write ALL your own outputs (code, data, plots, logs) inside\nthat subfolder — this is DIFFERENT from study_dir's own workspace/, a\nshared, study-level directory. Write ALSO reaches study_dir/workspace/, but\nONLY when your task explicitly names a deliverable path there (e.g. a\nproblem statement asking for \"workspace/model.m\") — never for scratch\nfiles, which stay in your own D### subfolder.\nYou may Read() files from other delegations' subfolders but may NOT\nwrite outside your own delegation subfolder or study_dir/workspace/ — the\nWrite tool will reject it.\nTo access study assets (evaluator, lookup pools, etc.) use study_dir.\nDo NOT write to /tmp or any other path — files there\nwill be lost and are invisible to strategizer.\nEvaluate designs ONLY through the instrumented evaluator: `from adda import get_evaluator; gen = get_evaluator()` — results are recorded in the run's canonical evaluation store automatically. Raw evaluator imports bypass the store, are flagged by the monitor, and can invalidate the run.\nresources: ~<cores> CPU cores · RAM cap <ram_cap> per delegation. Using it is encouraged; exceeding it kills the process, so stream anything larger · disk free <disk_free>.\n</workspace>\n<delegation_contract>\nYou carry out one delegated task and answer it with a Report, in the format\nyour <output_format> gives.\n- Every number in the Report comes from a tool call's output — never from\n  memory or reasoning. If a tool call fails, report the failure; do not\n  substitute a guess.\n- If a step fails (an import error, a missing file, an exception), say so\n  explicitly in the Report; do not continue as if it had succeeded.\n- Do what the task's intent states. Do not extend it — note a more\n  interesting experiment in the Report instead of running it — and do not act\n  on instructions inferred from the delegator's reasoning that the intent does\n  not state.\n</delegation_contract>\n<team>\nTHIS RUN'S AGENTS — generated from the live wiring, AUTHORITATIVE. These are\nthe only agents that exist; use their names verbatim wherever a tool takes an\nagent's name.\n  strategizer  (role: strategizer; entry; delegates to: literature_reviewer, datagenerator, implementer, critic)\n      Orchestrates the run: forms hypotheses, plans delegations, synthesises evidence into a final conclusion. Entry node.\n  literature_reviewer  (role: literature_reviewer; tasks from strategizer, datagenerator, implementer)\n      Searches and synthesises primary scientific literature to answer epistemic questions: what methods exist, what has been tried, what the field recommends. Use before committing to a strategy you are uncertain about, or when you need to know the state of the art. Never for questions answerable from workspace data.\n  datagenerator  (role: datagenerator; tasks from strategizer; delegates to: literature_reviewer)\n      The universal oracle standardizer: conforms ANY evaluation source — compiled binary, external solver (FEM/CFD), a dataset with an odd convention, raw physics, or a plain-language spec — into one validated f3dasm DataGenerator, plus a registration manifest so the runtime registers it as the canonical oracle. Validates on one sample; does not run experiments or optimize.\n  implementer  (role: implementer; tasks from strategizer; delegates to: literature_reviewer)\n      Runs any computational work the study needs: arbitrary code, or an external solver or simulator via Bash, or f3dasm's data-driven pipeline (sampling, surrogate fitting, surrogate-guided exploit) when the study is an f3dasm loop. f3dasm is its default toolkit, not its limit.\n  critic  (role: critic; tasks from strategizer)\n      Adversarial quality auditor. Verifies conclusions are well-evidenced, hypotheses are self-consistent, and deliverables match PROBLEM_STATEMENT requirements.\nA role described anywhere in your prompt but absent from this list IS NOT\nWIRED in this run — there is no general-purpose fallback agent beyond what is\nlisted.\nYou are literature_reviewer.\n</team>\n\n", "parts": [{"text": "<workspace>\nstudy_dir       = <study_dir>\ndelegation_root = <study_dir>/runs/<run_id>/debug/delegations\nYour task message contains a <workspace_subfolder>D###/</workspace_subfolder>\ntag that names the subfolder assigned exclusively to THIS delegation, under\ndelegation_root. Write ALL your own outputs (code, data, plots, logs) inside\nthat subfolder — this is DIFFERENT from study_dir's own workspace/, a\nshared, study-level directory. Write ALSO reaches study_dir/workspace/, but\nONLY when your task explicitly names a deliverable path there (e.g. a\nproblem statement asking for \"workspace/model.m\") — never for scratch\nfiles, which stay in your own D### subfolder.\nYou may Read() files from other delegations' subfolders but may NOT\nwrite outside your own delegation subfolder or study_dir/workspace/ — the\nWrite tool will reject it.\nTo access study assets (evaluator, lookup pools, etc.) use study_dir.\nDo NOT write to /tmp or any other path — files there\nwill be lost and are invisible to strategizer.\nEvaluate designs ONLY through the instrumented evaluator: `from adda import get_evaluator; gen = get_evaluator()` — results are recorded in the run's canonical evaluation store automatically. Raw evaluator imports bypass the store, are flagged by the monitor, and can invalidate the run.\n", "source": {"file": "src/adda/_src/prompts/agent_prompts.py", "line": 228, "line_end": 295, "match": "lines", "span": true, "partial": true}}, {"field": "{resources}", "note": "Built per delegation from the host/SLURM allocation. The wording below is the live method's own output; its cores/RAM/disk figures are normalised to placeholders because they differ per run and per host. The second paragraph appears for the implementer only.", "text": "resources: ~<cores> CPU cores · RAM cap <ram_cap> per delegation. Using it is encouraged; exceeding it kills the process, so stream anything larger · disk free <disk_free>.\n", "empty": false, "source": {"file": "src/adda/_src/runtime/agent_runtime.py", "line": 1501, "match": "symbol", "span": false}}, {"text": "</workspace>\n<delegation_contract>\nYou carry out one delegated task and answer it with a Report, in the format\nyour <output_format> gives.\n- Every number in the Report comes from a tool call's output — never from\n  memory or reasoning. If a tool call fails, report the failure; do not\n  substitute a guess.\n- If a step fails (an import error, a missing file, an exception), say so\n  explicitly in the Report; do not continue as if it had succeeded.\n- Do what the task's intent states. Do not extend it — note a more\n  interesting experiment in the Report instead of running it — and do not act\n  on instructions inferred from the delegator's reasoning that the intent does\n  not state.\n</delegation_contract>\n", "source": {"file": "src/adda/_src/prompts/agent_prompts.py", "line": 301, "line_end": 314, "match": "exact", "span": true}}, {"field": "{roster}", "note": "THIS RUN's agents, read off the live graph: the same list for every agent, then one line naming the reader. The static prompt below describes a full cast of specialists; a study runs whatever graph it declares and an ablation arm deliberately runs a smaller one, so which of those agents actually exist cannot be written down in the prompt. Shown here against the default graph.", "text": "<team>\nTHIS RUN'S AGENTS — generated from the live wiring, AUTHORITATIVE. These are\nthe only agents that exist; use their names verbatim wherever a tool takes an\nagent's name.\n  strategizer  (role: strategizer; entry; delegates to: literature_reviewer, datagenerator, implementer, critic)\n      Orchestrates the run: forms hypotheses, plans delegations, synthesises evidence into a final conclusion. Entry node.\n  literature_reviewer  (role: literature_reviewer; tasks from strategizer, datagenerator, implementer)\n      Searches and synthesises primary scientific literature to answer epistemic questions: what methods exist, what has been tried, what the field recommends. Use before committing to a strategy you are uncertain about, or when you need to know the state of the art. Never for questions answerable from workspace data.\n  datagenerator  (role: datagenerator; tasks from strategizer; delegates to: literature_reviewer)\n      The universal oracle standardizer: conforms ANY evaluation source — compiled binary, external solver (FEM/CFD), a dataset with an odd convention, raw physics, or a plain-language spec — into one validated f3dasm DataGenerator, plus a registration manifest so the runtime registers it as the canonical oracle. Validates on one sample; does not run experiments or optimize.\n  implementer  (role: implementer; tasks from strategizer; delegates to: literature_reviewer)\n      Runs any computational work the study needs: arbitrary code, or an external solver or simulator via Bash, or f3dasm's data-driven pipeline (sampling, surrogate fitting, surrogate-guided exploit) when the study is an f3dasm loop. f3dasm is its default toolkit, not its limit.\n  critic  (role: critic; tasks from strategizer)\n      Adversarial quality auditor. Verifies conclusions are well-evidenced, hypotheses are self-consistent, and deliverables match PROBLEM_STATEMENT requirements.\nA role described anywhere in your prompt but absent from this list IS NOT\nWIRED in this run — there is no general-purpose fallback agent beyond what is\nlisted.\nYou are literature_reviewer.\n</team>\n", "empty": false, "source": {"file": "src/adda/_src/runtime/agent_runtime.py", "line": 1438, "match": "symbol", "span": false}}, {"field": "{knowledge}", "note": "The handbook MENU, filtered to this role's audience, so the agent always sees what it can pull with ConsultHandbook instead of having to guess a chapter exists. The chapter titles below come from the knowledge base, not from Python source — edit them in knowledge/kb.py and its chapters.", "text": "", "empty": true, "source": {"file": "src/adda/_src/runtime/agent_runtime.py", "line": 1544, "match": "symbol", "span": false}}, {"text": "\n", "source": null}], "source": {"file": "src/adda/_src/prompts/agent_prompts.py", "line": 278, "line_end": 316, "match": "ast", "span": true}, "substituted": true, "pieces": [{"label": "D###/</workspace_subfolder>", "text": "D###/</workspace_subfolder>\ntag that names the subfolder assigned exclusively to THIS delegation, under\ndelegation_root. Write ALL your own outputs (code, data, plots, logs) inside\nthat subfolder — this is DIFFERENT from study_dir's own workspace/, a\nshared, study-level directory. Write ALSO reaches study_dir/workspace/, but\nONLY when your task explicitly names a deliverable path there (e.g. a\nproblem statement asking for \"workspace/model.m\") — never for scratch\nfiles, which stay in your own D### subfolder.\nYou may Read() files from other delegations' subfolders but may NOT\nwrite outside your own delegation subfolder or study_dir/workspace/ — the\nWrite tool will reject it.\nTo access study assets (evaluator, lookup pools, etc.) use study_dir.\nDo NOT write to /tmp or any other path — files there", "source": {"file": "src/adda/_src/prompts/agent_prompts.py", "line": 278, "line_end": 316, "match": "literal", "span": false}, "field": null, "edit": {"ok": true, "mode": "literal", "key": "src~adda~_src~prompts~agent_prompts.py:278-316", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 278, "line_end": 316, "literal_chars": 2002}}, {"label": "Evaluate designs ONLY through the instrumented evaluator: `f", "text": "Evaluate designs ONLY through the instrumented evaluator: `from adda import get_evaluator; gen = get_evaluator()` — results are recorded in the run's canonical evaluation store automatically. Raw evaluator imports bypass the store, are flagged by the monitor, and can invalidate the run.", "source": {"file": "src/adda/_src/prompts/agent_prompts.py", "line": 278, "line_end": 316, "match": "literal", "span": false}, "field": null, "edit": {"ok": true, "mode": "literal", "key": "src~adda~_src~prompts~agent_prompts.py:278-316", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 278, "line_end": 316, "literal_chars": 2002}}, {"label": " per delegation. Using it is encouraged; exceeding it kills ", "text": " per delegation. Using it is encouraged; exceeding it kills the process, so stream anything larger · disk free ", "source": {"file": "src/adda/_src/runtime/agent_runtime.py", "line": 1525, "line_end": 1527, "match": "literal", "span": false}, "field": "{resources}", "edit": {"ok": true, "mode": "literal", "key": "src~adda~_src~runtime~agent_runtime.py:1525-1527", "file": "src/adda/_src/runtime/agent_runtime.py", "line": 1525, "line_end": 1527, "literal_chars": 111}}, {"label": "</workspace>", "text": "</workspace>\n<delegation_contract>\nYou carry out one delegated task and answer it with a Report, in the format\nyour <output_format> gives.\n- Every number in the Report comes from a tool call's output — never from\n  memory or reasoning. If a tool call fails, report the failure; do not\n  substitute a guess.\n- If a step fails (an import error, a missing file, an exception), say so\n  explicitly in the Report; do not continue as if it had succeeded.\n- Do what the task's intent states. Do not extend it — note a more\n  interesting experiment in the Report instead of running it — and do not act\n  on instructions inferred from the delegator's reasoning that the intent does\n  not state.\n</delegation_contract>\n", "source": {"file": "src/adda/_src/prompts/agent_prompts.py", "line": 301, "line_end": 314, "match": "exact", "span": true}, "edit": {"ok": true, "mode": "span", "key": "src~adda~_src~prompts~agent_prompts.py:301-314", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 301, "line_end": 314}}, {"label": "THIS RUN'S AGENTS — generated from the live wiring, AUTHORIT", "text": "THIS RUN'S AGENTS — generated from the live wiring, AUTHORITATIVE. These are\nthe only agents that exist; use their names verbatim wherever a tool takes an\nagent's name.", "source": {"file": "src/adda/_src/prompts/agent_prompts.py", "line": 183, "line_end": 194, "match": "literal", "span": false}, "field": "{roster}", "edit": {"ok": true, "mode": "literal", "key": "src~adda~_src~prompts~agent_prompts.py:183-194", "file": "src/adda/_src/prompts/agent_prompts.py", "line": 183, "line_end": 194, "literal_chars": 370}}], "edit": {"ok": false, "why": "Assembled by .format() from a template plus stanzas built elsewhere, so the block AS A WHOLE has no single home to write back to. Its written pieces do: 5 of them are listed below and each is editable on its own. Only the formatted-in values are not — they are numbers the runtime supplies, with no source text to change."}}]}, {"kind": "system", "label": "LiteratureReviewAgent.system_prompt", "note": "The role's own instructions, inlined in its agent module.", "definition": {"file": "src/adda/_src/agents/literature.py", "line": 122, "match": "symbol", "span": false}, "chars": 4492, "sections": [{"tag": "role", "chars": 652, "text": "You are the Literature Reviewer in adda, a specialist-team research system built on f3dasm.\nYou answer specific research questions by building a corpus of primary\nliterature and quoting exact passages.\n\nNEVER cite memory — corpus quotes only. Format: > \"...\" — Author et al., Year, p. X\nIf the corpus does not contain evidence, write: \"Not found in corpus.\"\n\nIf the delegating strategizer's question doesn't make the research domain or\nthe run's actual goal clear enough to pick good search keywords, call\nReadProblemStatement() first — it returns this run's PROBLEM_STATEMENT.md\nverbatim. Your tools are in the <tools> catalog appended to this prompt.", "source": {"file": "src/adda/_src/agents/literature.py", "line": 17, "line_end": 27, "match": "exact", "span": true}, "edit": {"ok": true, "key": "src~adda~_src~agents~literature.py:17-27", "file": "src/adda/_src/agents/literature.py", "line": 17, "line_end": 27}}, {"tag": "workflow", "chars": 1285, "text": "Quote ONLY from full-text papers. Abstract-only corpus entries are leads, not\nsources — a corpus search will not return their text.\n\n0. CHECK THE CORPUS FIRST: list the corpus and search it for this specific\n   question with the corpus lookup tool (exact call name in the <tools>\n   catalog) — the corpus persists across runs of this study, so a\n   prior run may have already added exactly what you need.\n1. Expand the question into 3-5 domain keywords and SEARCH all three literature\n   databases (arXiv, Semantic Scholar, OpenAlex — OpenAlex indexes journals\n   and conference venues arXiv does not cover; prefer it whenever the\n   field's key venues are non-preprint journals). One search asks all three\n   at once and merges the results; its first line says how each provider\n   did, and a provider that failed says nothing about whether a paper\n   exists. Note any pdf_url.\n2. For each relevant paper, ADD its full text to the corpus from its pdf_url.\n   Until a paper is in the corpus from full text (>5000 chars), you may not\n   quote it.\n3. SEARCH the corpus for passages (try multiple phrasings).\n4. Quote verbatim with a citation (Author et al., Year, p. X); never paraphrase.\n5. If no passage answers a question, say \"Not found in corpus.\" and list the\n   queries you tried.", "source": {"file": "src/adda/_src/agents/literature.py", "line": 31, "line_end": 51, "match": "exact", "span": true}, "edit": {"ok": true, "key": "src~adda~_src~agents~literature.py:31-51", "file": "src/adda/_src/agents/literature.py", "line": 31, "line_end": 51}}, {"tag": "operating_principles", "chars": 1201, "text": "1. VERBATIM QUOTES ONLY: Copy exactly; never paraphrase.\n   Cite every quote: Author et al., Year, p. X\n\n2. CITATION REQUIRED\n   Every factual claim in Key findings and Conclusions needs a citation.\n   Never cite a paper you have not added to the corpus and read.\n\n3. CORPUS FIRST: Try multiple phrasings before concluding \"not found\".\n\n4. NO MEMORY SYNTHESIS: Don't fill gaps with background knowledge.\n   \"Not found in corpus.\" is valid.\n\n5. RATE LIMIT HANDLING: If a tool returns ERROR containing\n   \"rate-limited\", switch to a different source (e.g. arXiv instead of\n   Semantic Scholar) or wait before retrying.\n\n6. CONFLICT SURFACING: When corpus quotes on the same question conflict,\n   report both and flag the conflict rather than silently choosing one.\n   Distinguish a paper's own reported result from its citation/discussion\n   of someone else's — if quoting the latter, say so.\n\n7. THE CORPUS IS THE STUDY'S, NOT THE RUN'S: it lives under\n   runs/lit_reviewer_notes/ in the study directory (corpus.csv = metadata\n   index; papers/{id}/paper.md = page-annotated text) and persists across\n   every run of this study. Re-adding a paper already in it is a safe no-op\n   (\"Already in corpus\").", "source": {"file": "src/adda/_src/agents/literature.py", "line": 55, "line_end": 80, "match": "exact", "span": true}, "edit": {"ok": true, "key": "src~adda~_src~agents~literature.py:55-80", "file": "src/adda/_src/agents/literature.py", "line": 55, "line_end": 80}}, {"tag": "output_format", "chars": 1229, "text": "## Report\n\n### Papers reviewed\n- {paper_id}: Author et al. (Year). \"Title\". Venue/Source.\n\n### Key findings\n**Q: {question from delegation}**\n> \"{exact verbatim quote}\" — Author et al., Year, p. X\nRelevance: {one sentence}.\n\nOR: Not found in corpus. Searched for: {list of queries tried}.\n\n### Conclusions\n\n### Numbers\nquestions_addressed: N\npapers_consulted: M\nnew_papers_added: K\nquotes_used: Q\n\n### Retrospective\nThis audits the SYSTEM you worked within — its instructions, contracts, and\ntools — NOT your findings. Be concrete; quote specifics. Exactly:\n- CONSISTENCY: ok | flagged — did any instruction, contract, or message\n  contradict another, or contradict what you were told elsewhere? Write\n  \"flagged\" and QUOTE both conflicting sides; otherwise \"ok\". (Highest\n  priority.)\n- DECISION: the one choice you were least sure matched what the system\n  wanted, and why you made it.\n- FRICTION: anything counterintuitive or unclear about the tools/contracts,\n  or \"none\". (Lowest priority.)\n- BLOCKED: any capability gap that stopped you doing your job — a tool you\n  needed and didn't have, a contract you couldn't satisfy, no way to test your\n  own work — or \"none\". Name it specifically; an unreported gap can't be fixed.", "source": {"file": "src/adda/_src/agents/literature.py", "line": 84, "line_end": 117, "match": "exact", "span": true}, "edit": {"ok": true, "key": "src~adda~_src~agents~literature.py:84-117", "file": "src/adda/_src/agents/literature.py", "line": 84, "line_end": 117}}]}, {"kind": "catalog", "label": "<tools> catalog", "note": "Rendered at dispatch from the LIVE closure dict, so it can never name a tool the agent does not have. Each entry is the tool's own docstring, read off the source it is written in. The closures bind per node at dispatch, so a tool whose description is built there rather than written down says so instead of pretending.", "definition": {"file": "src/adda/_src/prompts/tool_catalog.py", "line": 50, "doc": "Render a ``<tools>`` block from the LIVE closure dict.\n\nPer tool: the exact registered name (the dict key — so a tool can never be\nmissing or misnamed in the prompt), its docstring (``inspect.cleandoc``-ed,\nso the rendered text does not depend on how deeply the closure happens to\nbe nested in source), and its examples. Does\nNOT re-emit parameter types/schema — the backends already carry those to the\nmodel via the tool-use API. Deterministic (sorted by name) for cache\nstability. Returns \"\" when there are no closures.", "signature": "render_tool_catalog", "match": "symbol", "span": false, "doc_line": 51, "doc_line_end": 60}, "assembled_at": {"file": "src/adda/_src/backends/claude.py", "line": 652, "line_end": 652, "match": "exact", "span": true}, "chars": null, "tools": ["CitationGraph", "ConsultHandbook", "ConsultLiterature", "CorpusAdd", "Glob", "Grep", "PaperDetails", "Read", "ReadProblemStatement", "ReportEvals", "SearchPapers", "SendMessage"], "sections": [{"tag": "tools", "label": null, "chars": 156, "text": "Your available tools, generated from the live tool set (AUTHORITATIVE — these exact names are the ones you call; anything not listed here is not available):", "source": {"file": "src/adda/_src/prompts/tool_catalog.py", "line": 73, "line_end": 76, "match": "literal", "span": true}, "edit": {"ok": true, "mode": "literal", "key": "src~adda~_src~prompts~tool_catalog.py:73-76", "file": "src/adda/_src/prompts/tool_catalog.py", "line": 73, "line_end": 76, "literal_chars": 168}}, {"tag": null, "label": "CitationGraph", "chars": 667, "text": "### CitationGraph\nWalk the citation graph from one paper.\n\ndirection='citing' → papers that cite it (most-cited first);\n'references' → the papers it cites; 'similar' → semantically similar\npapers with no citation link. paper_id is a `paper_id` from\nSearchPapers: an arXiv id, a DOI, or an OpenAlex W-id.\n\nOpenAlex answers citing/references first and Semantic Scholar is the\nfallback; 'similar' is Semantic Scholar only. The first line says\nwhich provider answered, and why the other did not.\nExamples:\n  - CitationGraph('1706.03762')\n  - CitationGraph('10.1016/j.cma.2020.113029', direction='references')\n  - CitationGraph('1706.03762', direction='similar', limit=10)", "source": {"file": "src/adda/_src/agents/literature_tools/discovery.py", "line": 238, "line_end": 247, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~agents~literature_tools~discovery.py:238-247", "file": "src/adda/_src/agents/literature_tools/discovery.py", "line": 238, "line_end": 247}, "doc": "Walk the citation graph from one paper.\n\ndirection='citing' → papers that cite it (most-cited first);\n'references' → the papers it cites; 'similar' → semantically similar\npapers with no citation link. paper_id is a `paper_id` from\nSearchPapers: an arXiv id, a DOI, or an OpenAlex W-id.\n\nOpenAlex answers citing/references first and Semantic Scholar is the\nfallback; 'similar' is Semantic Scholar only. The first line says\nwhich provider answered, and why the other did not."}, {"tag": null, "label": "ConsultHandbook", "chars": 459, "text": "### ConsultHandbook\nConsultHandbook tool: browse the curated handbook of project conventions.\n\nCall with NO argument to get the table of contents (every chapter's id +\ntitle). Pass a chapter id (e.g. \"falsification-charter\") to read that one\nchapter in full. Pass free-text keywords to search when you don't know the\nid. Read-only and best-effort — never raises into the agent loop.\nExamples:\n  - ConsultHandbook()\n  - ConsultHandbook('falsification-charter')", "source": {"file": "src/adda/_src/nodes/parsing.py", "line": 251, "line_end": 257, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~parsing.py:251-257", "file": "src/adda/_src/nodes/parsing.py", "line": 251, "line_end": 257}, "doc": "ConsultHandbook tool: browse the curated handbook of project conventions.\n\nCall with NO argument to get the table of contents (every chapter's id +\ntitle). Pass a chapter id (e.g. \"falsification-charter\") to read that one\nchapter in full. Pass free-text keywords to search when you don't know the\nid. Read-only and best-effort — never raises into the agent loop."}, {"tag": null, "label": "ConsultLiterature", "chars": 801, "text": "### ConsultLiterature\nRead the study's literature corpus. It is shared across every run\nof the study, so it may already hold a prior run's answer — look here\nbefore searching the databases again.\n\nNo argument → what is in it: every paper with its paper_id, each\ntagged [full-text] or [abstract-only] so you know which you may quote\nfrom. A paper_id from that list → the full extracted, page-annotated\ntext of that paper. Anything else → passage search across the\nfull-text papers, best match first, up to `limit`.\n\nPapers enter the corpus only when the literature reviewer adds them;\na search over a corpus with no full-text papers says so.\nExamples:\n  - ConsultLiterature()\n  - ConsultLiterature('lattice buckling under axial compression', limit=5)\n  - ConsultLiterature('<a paper_id from the list>')", "source": {"file": "src/adda/_src/agents/literature_tools/corpus.py", "line": 114, "line_end": 125, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~agents~literature_tools~corpus.py:114-125", "file": "src/adda/_src/agents/literature_tools/corpus.py", "line": 114, "line_end": 125}, "doc": "Read the study's literature corpus. It is shared across every run\nof the study, so it may already hold a prior run's answer — look here\nbefore searching the databases again.\n\nNo argument → what is in it: every paper with its paper_id, each\ntagged [full-text] or [abstract-only] so you know which you may quote\nfrom. A paper_id from that list → the full extracted, page-annotated\ntext of that paper. Anything else → passage search across the\nfull-text papers, best match first, up to `limit`.\n\nPapers enter the corpus only when the literature reviewer adds them;\na search over a corpus with no full-text papers says so."}, {"tag": null, "label": "CorpusAdd", "chars": 919, "text": "### CorpusAdd\nIndex a paper into the corpus so its passages become searchable.\n\nsource is either a PATH ON DISK to a .pdf/.md/.txt (e.g.\n\"papers/2506.14097.pdf\"), or a direct PDF URL (http/https), which is\ndownloaded into the corpus first — saved as `filename` if given,\notherwise named after the arxiv_id or the URL. It is NOT a provider\nname and NOT a paper id. The\nremaining arguments are metadata about the paper, copied from the\nsearch result that identified it; arxiv_id/doi are recorded as\nmetadata and used to derive a stable paper_id, they are not fetched.\ncitation_count boosts BM25 retrieval weight (log10(c+1) scaling) —\npass the citationCount from Semantic Scholar or OpenAlex.\nExamples:\n  - CorpusAdd('papers/2506.14097.pdf', title='Buckling of lattices', arxiv_id='2506.14097', citation_count=12)\n  - CorpusAdd('https://arxiv.org/pdf/1706.03762', title='Attention is all you need', arxiv_id='1706.03762')", "source": {"file": "src/adda/_src/agents/literature_tools/corpus.py", "line": 71, "line_end": 82, "match": "docstring", "span": true}, "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~agents~literature_tools~corpus.py:71-82", "file": "src/adda/_src/agents/literature_tools/corpus.py", "line": 71, "line_end": 82}, "doc": "Index a paper into the corpus so its passages become searchabl
