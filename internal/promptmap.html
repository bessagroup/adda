let query = "";

/* ---------------- edits ----------------
   The page is a map of what the repo SAYS, so an edit never rewrites the text
   shown in a section — that would make the map disagree with the source it
   cites. An edit is a proposal parked beside the section, in the artifact's own
   store, for the agent that maintains this repo to read back and apply. Which
   is also why only a section whose citation is a verbatim span may be edited:
   anything weaker has no span to write the edit back to. */
let DB = null;
const EDITS = new Map();          /* doc id -> stored edit */

/* WHO. The user capability is not available to this page, so there is no
   verified viewer identity to key edits on. A self-declared name is honest
   about that and enough to keep two people's work apart; it is a label, not
   an audit trail, and the staging view says so. */
const AUTHOR_KEY = "promptmap.author";
let ME = "";
try { ME = localStorage.getItem(AUTHOR_KEY) || ""; } catch(_) { ME = ""; }

const slug = name => (name || "anon").toLowerCase()
  .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "anon";

/* One document per (span, person). Two people proposing a change to the same
   prompt write to DIFFERENT documents, so neither can overwrite the other —
   the store's last-writer-wins applies only WITHIN one person's own edit, and
   even there the previous text is kept in `history` rather than dropped. */
const docId = (spanKey, who) => spanKey + "__" + slug(who);

/* Asking for the name is an INLINE field, never window.prompt: this page runs
   in a sandboxed frame where a modal may simply not open, and a control that
   can silently do nothing is worse than no control. */
function setAuthor(name){
  ME = (name || "").trim();
  try { localStorage.setItem(AUTHOR_KEY, ME); } catch(_) {}
  return ME;
}

const authorField = () => `<label class="whofield">your name
  <input type="text" data-name value="${esc(ME)}" placeholder="so your edits stay yours"
    spellcheck="false"></label>`;

async function initEdits(){
  try { DB = await claude?.use?.("db"); } catch(_) { DB = null; }
  if(!DB) return;                       // read-only view, or db unavailable
  document.body.dataset.edits = "on";
  DB.collection("edits").onSnapshot(snap => {
    EDITS.clear();
    snap.docs.forEach(d => { const v = d.data(); if(v) EDITS.set(d.id, v); });
    syncEditCount();
    if(view.kind === "edits") render();
    document.querySelectorAll("[data-editchip]").forEach(el => {
      el.innerHTML = editChip(el.dataset.editchip, el.dataset.row || "");
    });
    document.querySelectorAll("[data-rowflag]").forEach(el => {
      el.innerHTML = rowFlag(el.dataset.rowflag);
    });
  }, () => {});
}

const live = () => [...EDITS.values()].filter(e => e.status === "open");
const forSpan = key => live().filter(e => e.key === key);

function syncEditCount(){
  const b = document.querySelector('[data-view="edits"]');
  if(b) b.querySelector("em").textContent = num(live().length);
}

/* Which proposal, if any, is being shown ON the prompt: span key -> index into
   that span's proposals. Showing is per span and per reader — a view, not a
   state anyone else sees. */
const SHOWING = new Map();

/* On the row header, so a section carrying a proposal says so before you open
   it — with the reason, which is the part that tells you what was edited and
   why. Not a button: the header is one, and a button inside a button is not a
   thing. Opening the row gets you the suggestion toggle. */
function rowFlag(key){
  if(!key) return "";
  const list = forSpan(key);
  if(!list.length) return "";
  const first = list[0];
  const note = (first.note || "").trim();
  const more = list.length > 1 ? ` +${list.length - 1}` : "";
  return `<span class="rowprop" title="${esc(list.map(e =>
      (e.author || "anonymous") + (e.note ? " \u2014 " + e.note : "")).join("\n"))}"
    >\u270e ${esc(first.author || "anon")}${more}${
      note ? ` <i>${esc(note.length > 58 ? note.slice(0,57) + "\u2026" : note)}</i>` : ""}</span>`;
}

function editChip(key, rowKey){
  if(!key) return "";
  const mine = forSpan(key);
  if(!mine.length) return "";
  const shown = SHOWING.has(key);
  const label = mine.length === 1 ? "1 proposal" : `${mine.length} proposals`;
  return `<button class="chip k-open sugg${shown ? " on" : ""}" type="button"
    data-suggest="${esc(key)}" data-row="${esc(rowKey || "")}"
    title="${shown ? "Back to the text as the repository has it"
                   : "Show the proposal on the prompt, struck through and underlined"}"
    >${label} \u00b7 ${shown ? "hide" : "show"}</button>`;
}

/* Paint (or unpaint) one section's prompt with the proposal showing. */
function paintSuggestion(spanKey, rowKey){
  const pre = document.getElementById("txt-" + rowKey);
  const sec = SECTIONS.get(rowKey);
  if(!pre || !sec) return;
  const list = forSpan(spanKey).filter(e => e.kind !== "note");
  const idx = SHOWING.get(spanKey);
  if(idx === undefined || !list.length){
    pre.classList.remove("suggesting");
    pre.innerHTML = promptBody(sec);
  } else {
    const e = list[Math.min(idx, list.length - 1)];
    pre.classList.add("suggesting");
    pre.innerHTML = suggestionHTML(e.base || sec.text, e.proposed || "");
  }
  const bar = document.getElementById("sg-" + rowKey);
  if(bar) bar.innerHTML = suggestionBar(spanKey, rowKey);
  document.querySelectorAll(`[data-editchip="${CSS.escape(spanKey)}"]`).forEach(el => {
    el.innerHTML = editChip(spanKey, el.dataset.row || "");
  });
}

/* Who is suggesting, why, and — when more than one person has — which of them
   you are looking at. */
function suggestionBar(spanKey, rowKey){
  const idx = SHOWING.get(spanKey);
  if(idx === undefined) return "";
  const list = forSpan(spanKey).filter(e => e.kind !== "note");
  if(!list.length) return "";
  const e = list[Math.min(idx, list.length - 1)];
  return `<div class="suggbar">
    <span class="chip k-open">suggestion</span>
    <span class="src">by <b>${esc(e.author || "anonymous")}</b></span>
    ${e.note ? `<span class="why">${esc(e.note)}</span>` : ""}
    ${list.length > 1 ? list.map((o,i) => `<button class="editbtn${
        i === Math.min(idx, list.length-1) ? " save" : ""}" type="button"
        data-suggest="${esc(spanKey)}" data-row="${esc(rowKey)}" data-idx="${i}"
      >${esc(o.author || "anon")}</button>`).join("") : ""}
    <span class="src">nothing is applied until it is applied to the source</span>
  </div>`;
}

/* Has the source moved under an edit since it was written? The map is
   regenerated from the repo, so the CURRENT text of that span is right here in
   DATA — an edit whose base no longer matches it is the merge conflict, and
   the staging view shows both sides rather than letting an apply guess. */
const SPAN_TEXT = new Map();
function indexSpans(){
  DATA.roles.forEach(r => r.layers.forEach(l => (l.sections || []).forEach(sec => {
    if(sec.edit && sec.edit.ok) SPAN_TEXT.set(sec.edit.key, sec.text);
  })));
}

function staleness(e){
  if(!SPAN_TEXT.has(e.key)) return {kind:"gone",
    why:"This section is no longer in the map under that span — the prompt was "
        + "moved, renamed, or removed since the edit was written."};
  const now = SPAN_TEXT.get(e.key);
  if(now !== e.base) return {kind:"moved", now,
    why:"The source changed after this edit was written. Applying it blind would "
        + "undo that change, so it needs a merge."};
  return null;
}

/* A line diff, longest-common-subsequence, collapsing long runs of context.
   Small enough to read, which matters more here than being optimal. */
function lineDiff(a, b){
  const A = String(a).split("\n"), B = String(b).split("\n");
  const n = A.length, m = B.length;
  const L = Array.from({length:n+1}, () => new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n && j<m){
    if(A[i]===B[j]){ out.push(["ctx",A[i]]); i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]) out.push(["del",A[i++]]);
    else out.push(["add",B[j++]]);
  }
  while(i<n) out.push(["del",A[i++]]);
  while(j<m) out.push(["add",B[j++]]);
  const keep = out.map(()=>false);
  out.forEach((r,k)=>{ if(r[0]!=="ctx") for(let d=-3;d<=3;d++) if(out[k+d]) keep[k+d]=true; });
  const res=[]; let skipped=0;
  out.forEach((r,k)=>{
    if(keep[k]){ if(skipped){ res.push(["gap",`\u2026 ${skipped} unchanged line${skipped>1?"s":""}`]); skipped=0; } res.push(r); }
    else skipped++;
  });
  if(skipped) res.push(["gap",`\u2026 ${skipped} unchanged line${skipped>1?"s":""}`]);
  return res;
}

/* A word-level diff, for showing a proposal ON the prompt rather than beside
   it. Run only over the stretches the line diff already found changed, so a
   twelve-thousand-character prompt costs a comparison of the sentence someone
   actually touched. */
function wordDiff(a, b){
  const cut = t => t.split(/(\s+)/).filter(x => x !== "");
  const A = cut(a), B = cut(b), n = A.length, m = B.length;
  const L = Array.from({length:n+1}, () => new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const out=[]; let i=0,j=0;
  const push=(k,t)=>{ const last=out[out.length-1];
    if(last && last[0]===k) last[1]+=t; else out.push([k,t]); };
  while(i<n && j<m){
    if(A[i]===B[j]){ push("ctx",A[i]); i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]) push("del",A[i++]);
    else push("add",B[j++]);
  }
  while(i<n) push("del",A[i++]);
  while(j<m) push("add",B[j++]);
  return out;
}

/* The suggestion rendering: the prompt as it stands, with what the proposal
   takes out struck through and what it puts in underlined. The source text is
   never replaced by the proposal — both are on the page at once, which is the
   whole point of a suggestion as against an edit. */
function suggestionHTML(base, proposed){
  const runs = lineDiff(base, proposed);
  const out = [];
  for(let i=0;i<runs.length;i++){
    const [kind, text] = runs[i];
    if(kind === "ctx"){ out.push(esc(text) + "\n"); continue; }
    if(kind === "gap"){ out.push(esc(text) + "\n"); continue; }
    if(kind === "del"){
      // Gather the del-run and any add-run right after it, and compare them
      // word by word — a reworded sentence should read as a reworded
      // sentence, not as one line removed and another added.
      const dels = []; while(runs[i] && runs[i][0]==="del") dels.push(runs[i++][1]);
      const adds = []; while(runs[i] && runs[i][0]==="add") adds.push(runs[i++][1]);
      i--;
      if(!adds.length){ out.push(`<del>${esc(dels.join("\n"))}</del>\n`); continue; }
      out.push(wordDiff(dels.join("\n"), adds.join("\n")).map(([k,t]) =>
        k === "ctx" ? esc(t) : k === "del" ? `<del>${esc(t)}</del>` : `<ins>${esc(t)}</ins>`
      ).join("") + "\n");
      continue;
    }
    out.push(`<ins>${esc(text)}</ins>\n`);
  }
  return out.join("");
}

const renderDiff = (a,b) => `<div class="diff">${
  lineDiff(a,b).map(([k,t])=>`<div class="${k}">${esc(
    k==="del" ? "- "+t : k==="add" ? "+ "+t : k==="gap" ? t : "  "+t)}</div>`).join("")}</div>`;


/* ---------------- rail ---------------- */
function buildRail(){
  const roles = $("#rail-roles");
  DATA.roles.forEach(r=>{
    const b = document.createElement("button");
    b.className="railbtn"; b.type="button"; b.dataset.role=r.id;
    b.innerHTML = `<span>${esc(r.id)}</span><em>${num(r.static_chars)}</em>`;
    b.onclick = ()=>{ view={kind:"role",id:r.id}; query=""; $("#q").value=""; render(); };
    roles.appendChild(b);
  });
  const views = $("#rail-views");
  [["gates","Gates",DATA.gates.length],["config","Config knobs",DATA.switches.length],
   ["shared","Shared blocks",DATA.shared.length],
   ["reflection","Reflection",DATA.reflection.rows.length],
   ["changes","Changes",DATA.changelog.length],
   ["edits","My edits",0]].forEach(([k,label,n])=>{
    const b=document.createElement("button");
    b.className="railbtn"; b.type="button"; b.dataset.view=k;
    b.innerHTML=`<span>${label}</span><em>${n}</em>`;
    b.onclick=()=>{ view={kind:k}; query=""; $("#q").value=""; render(); };
    views.appendChild(b);
  });
  /* The committed page carries no generated_at/commit: an embedded commit
     hash can never be correct (the hash of the commit that would contain it
     isn't known until after that commit), and it made every regeneration a
     full-payload diff. Provenance lives in git's history of this file, not
     in its bytes -- so a stamp only shows up on an uncommitted --stamp copy. */
  $("#stamp").textContent = DATA.commit
    ? `${DATA.commit} · ${DATA.generated_at}`
    : "static build · see git log for provenance";
}

function syncRail(){
  document.querySelectorAll(".railbtn").forEach(b=>{
    const on = query ? false
      : (view.kind==="role" ? b.dataset.role===view.id : b.dataset.view===view.kind);
    b.setAttribute("aria-current", on ? "true" : "false");
  });
}

/* ---------------- pieces ---------------- */
function sourceLink(s){
  if(!s) return `<span class="src">unresolved</span>`;
  const exact = s.match==="exact" || s.match==="ast";
  const kind = exact ? "" :
    ` <span class="chip" title="${esc(MATCH_NOTE[s.match]||"")}">${s.span ? "\u2248" : "\u2193"} ${esc(s.match)}${s.partial ? " · partial" : ""}</span>`;
  return `<span class="src" title="${esc(MATCH_NOTE[s.match]||"")}">${esc(srcOf(s))}</span>${kind}`;
}

/* A prompt assembled by .format() is ONE piece of text to the model, so the
   page shows it as one — but the stretches the runtime computes and formats in
   are written in a different file from the template around them, and a map that
   hides that is the map that misattributes them. They are marked in place. */
function promptBody(sec){
  if(!sec.parts) return esc(sec.text);
  return sec.parts.map(p => p.field
    ? `<mark class="sub" title="${esc(p.field)} — built by ${esc(srcOf(p.source))}">${esc(p.text)}</mark>`
    : esc(p.text)).join("");
}

function partLegend(sec){
  const fields = (sec.parts||[]).filter(p=>p.field);
  if(!fields.length) return "";
  return `<div class="legend">${fields.map(p=>`<div class="legrow">
      <code>${esc(p.field)}</code>
      <span class="src">${esc(srcOf(p.source))}</span>
      <span class="chip k-fmt">${p.empty ? "empty for this role" : "built at run time"}</span>
      <p>${esc(p.note)}</p>
    </div>`).join("")}</div>`;
}

const SECTIONS = new Map();   /* row key -> the section object it renders */

/* A .format()-assembled block has no single home, but its WRITTEN stretches do:
   the template's own prose is a verbatim span, and the prose inside a computed
   stanza is a string constant in the module that builds it. Only the values
   formatted in have no source text to edit. Each piece registers as its own
   editor target, so the editor above works on it unchanged. */
function piecesBlock(sec, key){
  const pieces = sec.pieces || [];
  if(!pieces.length) return "";
  return `<div class="pieces" id="pcs-${key}">
    <div class="pieceshead">Editable pieces \u2014 ${pieces.length}</div>
    <p class="secnote">The block above is assembled, so it has no single home — but
      each stretch below is WRITTEN, in one file, and can be changed from here. What
      is missing from this list is the values formatted in: they are supplied per run
      and have no source text to edit.</p>
    ${pieces.map((pc,i) => {
      const pk = key + "-p" + i;
      SECTIONS.set(pk, pc);
      return `<div class="piece">
        <div class="piecetop">
          ${pc.field ? `<code>${esc(pc.field)}</code>` : ""}
          <span class="src">${esc(srcOf(pc.source))}</span>
          <span class="chip k-fmt">${pc.edit.mode === "literal"
            ? "inside a larger literal"
            : pc.edit.mode === "docstring" ? "docstring" : "verbatim span"}</span>
          <button class="editbtn" type="button" data-edit="${pk}">propose an edit</button>
          <span data-editchip="${esc(pc.edit.key)}" data-row="${pk}">${
            editChip(pc.edit.key, pk)}</span>
        </div>
        <div class="suggslot" id="sg-${pk}"></div>
        <div class="editslot" id="ed-${pk}"></div>
        <pre class="prompt piecetext">${esc(pc.text)}</pre>
      </div>`;
    }).join("")}
  </div>`;
}

function sectionRow(sec, key, open=false){
  SECTIONS.set(key, sec);
  const preview = sec.text.trim().split("\n")[0].slice(0,90);
  return `<div class="row" data-open="${open}">
    <button class="rowbtn" type="button" data-toggle="${key}">
      <svg class="chev" width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M2 1l4 3.5L2 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="rowtag">${sec.tag ? `&lt;${esc(sec.tag)}&gt;`
        : sec.label ? esc(sec.label) : `<i>${esc(preview)}</i>`}</span>
      <span data-rowflag="${sec.edit && sec.edit.key ? esc(sec.edit.key) : ""}">${
        sec.edit && sec.edit.key ? rowFlag(sec.edit.key) : ""}</span>
      <span class="rowspacer"></span>
      <span class="rowsrc">${esc(srcOf(sec.source))}</span>
      <span class="rowchars">${num(sec.chars)}</span>
    </button>
    <div class="rowbody"${open ? "" : " hidden"}>
      <div class="rowmeta">
        ${sourceLink(sec.source)}
        ${sec.injects ? `<span class="chip k-accent">injected verbatim · ${esc(sec.injects.name)} @ ${esc(sec.injects.file)}:${sec.injects.line}</span>` : ""}
        ${sec.substituted ? `<span class="chip" title="The angle-bracketed paths below stand in for values the runtime formats in per run. They are this map's placeholders, not prompt text — the source writes them as {study_dir} and the like.">paths substituted per run</span>` : ""}
        ${sec.generated ? `<span class="chip k-accent">built at run time, not written here</span>` : ""}
        <button class="copy" type="button" data-copy="${key}">copy text</button>
        ${sec.edit && sec.edit.ok
          ? `<button class="editbtn" type="button" data-edit="${key}">propose an edit</button>` : ""}
        ${(sec.pieces||[]).length
          ? `<a class="chip k-accent" href="#pcs-${key}">${sec.pieces.length} editable pieces \u2193</a>` : ""}
        <span data-editchip="${sec.edit && sec.edit.key ? sec.edit.key : ""}" data-row="${key}">${
          sec.edit && sec.edit.key ? editChip(sec.edit.key, key) : ""}</span>
      </div>
      <div class="suggslot" id="sg-${key}"></div>
      ${sec.edit && !sec.edit.ok
        ? `<p class="noedit"><b>Not editable from this page.</b> ${esc(sec.edit.why)}</p>` : ""}
      <div class="editslot" id="ed-${key}"></div>
      ${piecesBlock(sec, key)}
      ${partLegend(sec)}
      <pre class="prompt" id="txt-${key}">${promptBody(sec)}</pre>
    </div>
  </div>`;
}

/* ---------------- the editor ---------------- */
async function openEditor(key){
  const slot = document.getElementById("ed-"+key);
  const sec = SECTIONS.get(key);
  if(!slot || !sec || !sec.edit || !sec.edit.ok) return;
  if(slot.firstChild){ slot.innerHTML = ""; return; }      // toggle closed
  const id = docId(sec.edit.key, ME);
  const prior = EDITS.get(id);
  const others = forSpan(sec.edit.key).filter(e => e.author_slug !== slug(ME));
  const shared = sec.edit.shared;

  slot.innerHTML = `<div class="editor">
    ${shared ? `<p class="warnshared"><b>Shared text.</b> ${esc(shared.name)} is injected
      verbatim into ${esc(shared.also.join(", "))} as well. An edit here changes what
      ${shared.also.length > 1 ? "those agents see" : "that agent sees"} too.</p>` : ""}
    ${others.length ? `<p class="warnshared"><b>${others.length} other proposal${
      others.length>1?"s":""} on this section</b> \u2014 from ${
      esc(others.map(e=>e.author||"someone").join(", "))}. Yours is kept separately;
      neither overwrites the other, and both are shown side by side in My edits.</p>` : ""}
    <div class="erow">
      <label>this is a
        <select data-kind>
          <option value="proposal"${prior && prior.kind==="proposal" ? " selected":""}>proposed change to the prompt</option>
          <option value="note"${prior && prior.kind==="note" ? " selected":""}>note only \u2014 do not change the code</option>
        </select>
      </label>
      <span class="src">${esc(srcOf(sec.source))}</span>
      ${authorField()}
    </div>
    ${sec.edit.mode === "docstring" ? `<p class="secnote">This is a docstring —
      what the model is told, or what the gate says about itself. Write it as it should
      read; re-indenting it into the source is the applier's job, not yours.</p>` : ""}
    ${sec.edit.mode === "message" ? `<p class="secnote">This is what the gate hands back
      to the agent. It is written inline in the gate's own <code>return</code>, not as a
      named prompt constant, so the applier rewrites that expression. Keep the
      <code>{…}</code> placeholders — they are code, and dropping one drops the number
      or name it formats in.</p>` : ""}
    ${sec.edit.mode === "literal" ? `<p class="secnote">This text is a stretch INSIDE a
      larger string literal (${num(sec.edit.literal_chars)} characters, at
      ${esc(sec.edit.file)}:${sec.edit.line}\u2013${sec.edit.line_end}). It appears there
      exactly once, so your edit replaces exactly this stretch and the applier re-emits the
      literal around it \u2014 nothing else in it changes.</p>` : ""}
    <textarea data-proposed spellcheck="false">${esc(prior && prior.proposed ? prior.proposed : sec.text)}</textarea>
    <input type="text" data-note placeholder="why \u2014 the reason this change is right (optional, but it is what I read first)"
      value="${prior ? esc(prior.note || "") : ""}">
    <div class="erow">
      <button class="editbtn save" type="button" data-save="${key}">save</button>
      <button class="editbtn" type="button" data-cancel="${key}">cancel</button>
      ${prior ? `<button class="editbtn danger" type="button" data-withdraw="${esc(id)}">withdraw mine</button>` : ""}
      <span data-status></span>
    </div>
  </div>`;
  const ta = slot.querySelector("[data-proposed]");
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight+4, 640)+"px"; };
  ta.addEventListener("input", fit); fit(); ta.focus();
  slot.querySelector("[data-kind]").addEventListener("change", e => {
    ta.hidden = e.target.value === "note";
  });
  if((prior && prior.kind) === "note") ta.hidden = true;
}

/* Saving never drops text. A person's own re-save keeps what it replaced in
   `history`, so even the one overwrite the store permits is recoverable. */
const HISTORY_CAP = 6;

async function saveEdit(key){
  const slot = document.getElementById("ed-"+key);
  const sec  = SECTIONS.get(key);
  const kind = slot.querySelector("[data-kind]").value;
  const proposed = slot.querySelector("[data-proposed]").value;
  const note = slot.querySelector("[data-note]").value.trim();
  const status = slot.querySelector("[data-status]");
  const who = setAuthor(slot.querySelector("[data-name]").value);
  if(!who){
    status.textContent = "add your name first \u2014 it is what keeps your edits yours";
    slot.querySelector("[data-name]").focus(); return;
  }
  if(kind === "proposal" && proposed === sec.text && !note){
    status.textContent = "nothing changed"; return;
  }
  if(!DB){ status.textContent = "not saved \u2014 this view cannot write"; return; }
  const id = docId(sec.edit.key, who);
  const prior = EDITS.get(id);
  const history = prior
    ? [{proposed: prior.proposed, note: prior.note, kind: prior.kind,
        saved_at: prior.saved_at}, ...(prior.history || [])].slice(0, HISTORY_CAP)
    : [];
  status.textContent = "saving\u2026";
  try {
    await DB.doc("edits/"+id).set({
      key: sec.edit.key, kind, status: "open",
      author: who, author_slug: slug(who),
      file: sec.edit.file, line: sec.edit.line, line_end: sec.edit.line_end,
      tag: sec.tag || null,
      base: sec.text,                 /* the text this edit was written against */
      proposed: kind === "note" ? "" : proposed,
      note, saved_at: new Date().toISOString(),
      base_commit: DATA.commit || null, history,
    });
    slot.innerHTML = "";
  } catch(err){
    status.textContent = "could not save: " + (err && err.code ? err.code : "error");
  }
}

/* Withdrawing is a STATE, not a delete: the document stays, so a withdrawal
   can be undone and nothing a person wrote leaves the store by accident. */
async function setStatus(id, status){
  if(!DB) return;
  try { await DB.doc("edits/"+id).update({status}); } catch(_) {}
}

/* ---------------- edits view ---------------- */
function renderEdits(){
  if(!DB) return `<h1>My edits</h1>
    <p class="lede">This view cannot reach the artifact's store, so edits cannot be
    saved or read here. Open the artifact from your own Claude account.</p>`;

  const all = [...EDITS.entries()].map(([id, e]) => ({id, ...e}));
  const open = all.filter(e => e.status === "open");
  const applied = all.filter(e => e.status === "applied");
  const gone = all.filter(e => e.status === "withdrawn");

  const groups = new Map();
  open.forEach(e => { if(!groups.has(e.key)) groups.set(e.key, []); groups.get(e.key).push(e); });
  const ordered = [...groups.entries()].sort((a,b) =>
    (a[1][0].file + String(a[1][0].line).padStart(6,"0")).localeCompare(
     b[1][0].file + String(b[1][0].line).padStart(6,"0")));

  const card = (e, withDiff) => {
    const stale = e.status === "open" ? staleness(e) : null;
    return `<div class="editcard${stale ? " stale" : ""}">
    <div class="meta">
      <span class="chip ${e.status==="applied" ? "k-applied" : e.kind==="note" ? "k-note" : "k-open"}">${
        e.status==="applied" ? "applied \u00b7 "+esc(e.applied_commit||"") :
        e.status==="withdrawn" ? "withdrawn" :
        e.kind==="note" ? "note only" : "proposed change"}</span>
      <span class="src"><b>${esc(e.author || "anonymous")}</b></span>
      <span class="src">${esc((e.saved_at||"").slice(0,16).replace("T"," "))}</span>
      ${e.history && e.history.length
        ? `<span class="chip" title="Earlier versions of this person's own edit are kept in the store and are not lost.">${e.history.length} earlier version${e.history.length>1?"s":""} kept</span>` : ""}
      ${e.status==="open" ? `<button class="editbtn danger" type="button" data-withdraw="${esc(e.id)}">withdraw</button>` : ""}
      ${e.status==="withdrawn" ? `<button class="editbtn" type="button" data-restore="${esc(e.id)}">restore</button>` : ""}
    </div>
    ${stale ? `<p class="warnshared"><b>Needs a merge.</b> ${esc(stale.why)}</p>` : ""}
    ${e.note ? `<p class="why">${esc(e.note)}</p>`
             : `<p class="why" style="color:var(--ink-3)">(no reason given)</p>`}
    ${withDiff && e.kind !== "note" ? renderDiff(e.base||"", e.proposed||"") : ""}
    ${stale && stale.kind === "moved"
      ? `<p class="why" style="margin-top:8px"><b>What changed underneath, since this edit:</b></p>
         ${renderDiff(e.base||"", stale.now||"")}` : ""}
  </div>`;
  };

  const group = ([key, list]) => {
    const head = list[0];
    const differ = list.length > 1 &&
      new Set(list.map(e => e.proposed)).size > 1;
    return `<section class="egroup">
      <h3>${head.tag ? "&lt;"+esc(head.tag)+"&gt; " : ""}<span class="src">${
        esc(head.file)}:${head.line}\u2013${head.line_end}</span>
        ${list.length > 1 ? `<span class="chip k-soft">${list.length} people</span>` : ""}</h3>
      ${differ ? `<p class="warnshared"><b>These proposals differ.</b> Both are kept.
        Whoever applies them has to choose, or merge them by hand \u2014 nothing here
        picks a winner.</p>` : ""}
      ${list.map(e => card(e, true)).join("")}
    </section>`;
  };

  return `<p class="eyebrow">Staging</p><h1>My edits</h1>
    <p class="lede">Nothing here has changed the repository. Each entry is a proposal
      parked beside the prompt it belongs to, in this artifact's own store, and it
      survives every republish of the page. Tell the agent that maintains this repo to
      look at the edits and it will apply them to the source, run the suite, and mark
      them applied.</p>
    <p class="lede" style="color:var(--ink-3)">Each person's proposal on a section is
      its own record, so no one overwrites anyone. Re-saving your own keeps the version
      it replaced. Withdrawing sets a state rather than deleting. Names are
      self-declared \u2014 they separate people's work, they do not authenticate it.
      ${authorField()}</p>
    ${ordered.length ? `<h2 class="editsh">Open \u00b7 ${open.length} on ${ordered.length} section${
        ordered.length>1?"s":""}</h2>` + ordered.map(group).join("")
      : `<p class="lede">No open edits. Open a role, expand a section, and choose
         <b>propose an edit</b>.</p>`}
    ${applied.length ? `<h2 class="editsh">Applied \u00b7 ${applied.length}</h2>`
        + applied.map(e => card(e, false)).join("") : ""}
    ${gone.length ? `<h2 class="editsh">Withdrawn \u00b7 ${gone.length}</h2>`
        + gone.map(e => card(e, false)).join("") : ""}`;
}

/* ---------------- role view ---------------- */
function renderRole(r){
  const measured = r.layers.filter(l=>l.chars);
  const total = measured.reduce((a,l)=>a+l.chars,0);

  const bar = measured.map(l=>{
    const pct = l.chars/total*100;
    return `<div class="compseg" style="width:${pct}%;background:${LAYER_COLOR[l.kind]}"
      title="${esc(LAYER_NAME[l.kind])} — ${num(l.chars)} chars">
      <span>${pct>11 ? Math.round(pct)+"%" : ""}</span></div>`;
  }).join("");

  const legend = measured.map(l=>
    `<span><i style="background:${LAYER_COLOR[l.kind]}"></i>${esc(LAYER_NAME[l.kind])}
     <em>${num(l.chars)}</em></span>`).join("");

  const layers = r.layers.map((l,li)=>{
    let body;
    if(l.kind==="catalog" && !l.sections.length){
      body = `<div class="rows"><div class="tools">${
        l.tools.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>`;
    } else {
      body = `<div class="rows">${l.sections.map((s,si)=>sectionRow(s,`${r.id}-${li}-${si}`)).join("")}</div>`;
    }
    return `<section class="layer">
      <div class="layerhead">
        <h2>${esc(l.label)}</h2>
        ${l.chars ? `<span class="chip">${num(l.chars)} chars</span>` : `<span class="chip">run-scoped</span>`}
        ${l.switch ? `<span class="chip k-soft">knob · ${esc(l.switch)}</span>` : ""}
      </div>
      <p class="layernote">${esc(l.note)}
        ${l.definition ? ` <code>${esc(l.definition.file)}:${l.definition.line}</code>` : ""}
        ${l.assembled_at ? ` · assembled at <code>${esc(srcOf(l.assembled_at))}</code>` : ""}</p>
      ${body}
    </section>`;
  }).join("");

  return `<p class="eyebrow">${r.entry ? "Entry node" : "Worker node"}</p>
    <h1>${esc(r.id)}</h1>
    <p class="lede">Everything below is in this agent's context window before it reads a
      single word of its task. Each row cites the file and line it comes from.</p>
    <div class="facts">
      <span><b>class</b> ${esc(r.class)}</span>
      <span><b>defined</b> ${esc(r.module)}</span>
      <span><b>tools</b> ${r.tool_count}</span>
      <span><b>delegates to</b> ${r.delegates_to.length ? esc(r.delegates_to.join(", ")) : "—"}</span>
    </div>
    <div class="comp">
      <div class="compbar">${bar}</div>
      <div class="complegend">${legend}
        <span><i style="background:transparent;border:1px solid var(--line)"></i>total
        <em>${num(total)} chars ≈ ${num(Math.round(total/4))} tokens</em></span>
      </div>
    </div>
    ${layers}`;
}

/* ---------------- gates ---------------- */
/* What a gate hands back to the agent -- a nudge, a refusal -- lands in the
   agent's context, so it is prompt, and it renders with the same row a role's
   prompt sections use: source first, then the text, one "propose an edit".
   Messages are short, so they render open: a collapsed row would only
   preview the text it hides. The gate's docstring is not shown: no agent
   reads it. */
function gateRows(g){
  const rows = [];
  const n = (g.messages||[]).length;
  (g.messages||[]).forEach((m, i) => {
    rows.push(sectionRow({
      label: `told to the agent${n > 1 ? ` · ${i+1} of ${n}` : ""}`,
      text: m.text, chars: m.text.length, edit: m.edit,
      source: {file: m.file, line: m.line, line_end: m.line_end,
               match: "message", span: true},
    }, "gatemsg-" + g.id + "-" + i, true));
  });
  const none = n ? "" : `<p class="nomsg">Tells the agent nothing of its own — what
    the agent experiences comes from the caller, or the gate only changes what
    happens next.</p>`;
  return none + `<div class="rows">${rows.join("")}</div>`;
}

function gateCard(g, n){
  return `<article class="gate" data-kind="${esc(g.kind)}">
    <div class="gatenum">${n ?? "·"}</div>
    <div class="gatebody">
      <div class="gatetop">
        <h3>${esc(g.title)}</h3>
        <span class="chip k-${esc(g.kind)}">${esc(g.kind)}</span>
        <span class="chip">${esc(g.phase)}</span>
        ${g.switch ? `<span class="chip k-soft">off via ${esc(g.switch)}</span>` : ""}
        ${g.escape ? `<span class="chip">escape · ${esc(g.escape)}</span>` : ""}
      </div>
      <p class="gateeffect" title="This map's one-line summary of what the agent experiences. It is written in internal/tools/promptmap.py, not in the repository's prompt or gate code.">${esc(g.effect)}</p>
      <div class="gatefoot">
        <span class="src">implemented at ${esc(g.file)}:${g.line}</span>
        <span class="chip">${esc(g.symbol)}</span>
        ${g.policy ? `<span class="chip">policy · ${esc(g.policy[0])}::${esc(g.policy[1])}</span>` : ""}
      </div>
      ${gateRows(g)}
    </div>
  </article>`;
}

function renderGates(){
  const chain = DATA.gates.filter(g=>g.done_order).sort((a,b)=>a.done_order-b.done_order);
  const rest  = DATA.gates.filter(g=>!g.done_order);
  const byPhase = {};
  rest.forEach(g=>(byPhase[g.phase] ||= []).push(g));

  const counts = ["hard","soft","procedural","advisory"].map(k=>{
    const n = DATA.gates.filter(g=>g.kind===k).length;
    return `<span class="chip k-${k}">${n} ${k}</span>`;
  }).join(" ");

  return `<p class="eyebrow">Machinery</p>
    <h1>What can stop the run</h1>
    <p class="lede">Every checkpoint between an agent's intention and its effect, with the
      symbol that implements it. A <em>hard</em> gate refuses; a <em>soft</em> one speaks and
      lets the agent proceed.</p>
    <p class="lede" style="color:var(--ink-3)">Each gate lists what it <b>tells the agent</b>
      — the only part of a gate that lands in an agent's context — laid out like a role's
      prompt sections, and editable the same way. A gate's <b>behaviour</b> is its code and is
      not; the italic line under the title is this map's own summary, not text from the
      repository.</p>
    <div class="facts" style="gap:6px">${counts}</div>

    <div class="sectionhead"><h2>The Done() sequence</h2>
      <p>Parsed from the literal tuple in <code>feedback.py</code> — this is the source's own order,
         not a reconstruction. A gate that holds returns immediately; nothing after it runs.</p></div>
    <div class="chain">${chain.map(g=>gateCard(g,g.done_order)).join("")}</div>

    ${Object.entries(byPhase).map(([phase,gs])=>`
      <div class="sectionhead"><h2>${esc(phase)}</h2>
        <p>${gs.length} checkpoint${gs.length>1?"s":""}, unordered — each fires on its own trigger.</p></div>
      <div class="chain">${gs.map(g=>gateCard(g,null)).join("")}</div>`).join("")}`;
}

/* ---------------- config ---------------- */
function renderConfig(){
  return `<p class="eyebrow">Machinery</p>
    <h1>Config knobs</h1>
    <p class="lede">Everything a reviewer can change without editing code. Resolution order is
      environment variable, then the study's <code>config.yaml</code> <code>runtime:</code> block,
      then the default — and an unrecognised key is reported rather than silently ignored.</p>
    <div class="sectionhead"><h2>${DATA.switches.length} knobs</h2>
      <p>Read from <code>runtime/settings.py</code> and from the environment reads found in source.</p></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Key</th><th>Set via</th><th>Environment override</th><th>Read at</th></tr></thead>
      <tbody>${DATA.switches.map(s=>`<tr>
        <td class="m">${esc(s.key)}</td>
        <td>${esc(s.kind)}</td>
        <td class="m">${esc(s.env)}</td>
        <td class="m path">${esc((s.sites||[s.file]).join("  "))}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;
}

/* ---------------- reflection ---------------- */
/* Who is asked to reflect on the SYSTEM (not the science), when, and what holds
   them to it. Every citation is resolved from the code by the generator; a
   mechanism the code does not have is said so in the row, not left blank. */
function citeList(cs){
  if(!cs.length) return `<span class="src">—</span>`;
  return cs.map(c=>`<div class="cite">${esc(c.label)}${c.file
    ? ` <span class="src">${esc(c.file.replace(/^src\/adda\/_src\//,""))}:${c.line}</span>` : ""}</div>`).join("");
}
/* The text that asks is prompt, so it renders as the same editable row the
   role and gate views use. A worker's request lives inside its <output_format>,
   so its row IS that section -- one place to edit it, whichever view you are in. */
function askRow(a, key){
  if(a.section){
    const role = DATA.roles.find(r=>r.id===a.section.role);
    const sec = role && role.layers.flatMap(l=>l.sections).find(x=>x.tag===a.section.tag);
    if(sec) return sectionRow(sec, key);
  }
  if(a.text) return sectionRow({label:a.label, text:a.text, chars:a.text.length, edit:a.edit,
    source:{file:a.file, line:a.line, line_end:a.line_end, match:"ast", span:true}}, key, true);
  return `<p class="nomsg">${esc(a.label)}</p>`;
}
function renderReflection(){
  const R = DATA.reflection;
  return `<p class="eyebrow">Machinery</p>
    <h1>Reflection</h1>
    <p class="lede">Each agent is asked for a <code>### Retrospective</code> about the system it
      worked within — its rules, tools and feedback — not about the science. Below, per role: the
      text that asks (editable, like any prompt section), when it fires, what enforces it, and what
      records the answer.</p>
    ${R.rows.map(r=>`<section class="layer">
      <div class="layerhead"><h2>${esc(r.role)}</h2></div>
      <p class="layernote">${esc(r.when)}</p>
      <div class="rows">${r.asks.map((a,i)=>askRow(a, `refl-${r.role}-${i}`)).join("")
        || `<p class="nomsg">Not asked.</p>`}</div>
      <div class="reflfacts">
        <div><b>Enforced by</b>${citeList(r.enforced)}</div>
        <div><b>Recorded by</b>${citeList(r.recorded)}</div>
      </div>
    </section>`).join("")}
    <div class="sectionhead"><h2>Where the answers land</h2>
      <p><code>${esc(R.sink.path)}</code>, one line per retrospective:
        ${R.sink.fields.map(f=>`<code>${esc(f)}</code>`).join(", ")}. ${esc(R.sink.flag)}
        Written by <span class="src">${esc(R.sink.source.file.replace(/^src\/adda\/_src\//,""))}:${R.sink.source.line}</span>.</p></div>`;
}

/* ---------------- changes ---------------- */
function renderChanges(){
  return `<p class="eyebrow">This page</p>
    <h1>Changes</h1>
    <p class="lede">What changed in this map itself, newest first. Changes to the prompts are in
      the repository's git history.</p>
    ${DATA.changelog.map(c=>`<div class="sectionhead"><h2>${esc(c.date)}</h2>
      <p>${esc(c.text)}</p></div>`).join("")}`;
}

/* ---------------- shared blocks ---------------- */
function renderShared(){
  return `<p class="eyebrow">Machinery</p>
    <h1>Shared blocks</h1>
    <p class="lede">Text defined once and injected verbatim into more than one role, so two agents
      can cite the same clause number at each other without paraphrase drift.</p>
    ${DATA.shared.map((b,i)=>{
      const used = DATA.roles.filter(r=>r.layers.some(l=>
        l.sections.some(s=>s.injects && s.injects.name===b.name))).map(r=>r.id);
      return `<section class="layer">
        <div class="layerhead"><h2>${esc(b.name)}</h2>
          <span class="chip">${num(b.chars)} chars</span>
          <span class="chip k-accent">in ${esc(used.join(", ")||"—")}</span></div>
        <p class="layernote">Defined at <code>${esc(b.file)}:${b.line}</code></p>
        <div class="rows">${sectionRow({tag:b.name,text:b.text,chars:b.chars,
          source:{file:b.file,line:b.line,match:"exact"}}, `shared-${i}`)}</div>
      </section>`;
    }).join("")}`;
}

/* ---------------- search ---------------- */
function renderSearch(q){
  const needle = q.toLowerCase();
  const hits = [];
  DATA.roles.forEach(r=>r.layers.forEach(l=>l.sections.forEach(s=>{
    const i = s.text.toLowerCase().indexOf(needle);
    if(i<0) return;
    hits.push({where:`${r.id} › ${s.tag ? "<"+s.tag+">" : l.label}`,
               src:srcOf(s.source), text:s.text, i,
               n:s.text.toLowerCase().split(needle).length-1});
  })));
  DATA.gates.forEach(g=>{
    const told = (g.messages||[]).map(m=>m.text).join("\n");
    const hay = (g.title+" "+g.effect+" "+told+" "+g.symbol).toLowerCase();
    const i = hay.indexOf(needle);
    const shown = g.effect+"\n"+told;
    if(i>=0) hits.push({where:`gate › ${g.title}`, src:`${g.file}:${g.line}`,
                        text:shown, i:Math.max(0,shown.toLowerCase().indexOf(needle)), n:1});
  });
  hits.sort((a,b)=>b.n-a.n);

  const body = hits.length ? hits.map(h=>{
    const from = Math.max(0, h.i-180), to = Math.min(h.text.length, h.i+needle.length+280);
    const raw = (from?"…":"") + h.text.slice(from,to) + (to<h.text.length?"…":"");
    const re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    const marked = esc(raw).replace(re, m=>`<mark>${m}</mark>`);
    return `<div class="hit">
      <div class="hittop"><b>${esc(h.where)}</b>
        <span class="src">${esc(h.src)}</span>
        <span class="chip">${h.n} match${h.n>1?"es":""}</span></div>
      <p class="hitex">${marked}</p></div>`;
  }).join("") : `<p class="empty">No prompt text or gate mentions “${esc(q)}”.</p>`;

  return `<p class="eyebrow">Search</p>
    <h1>“${esc(q)}”</h1>
    <p class="lede">${hits.length} place${hits.length===1?"":"s"} in the assembled prompts and gate
      definitions. Every result carries the file and line to open.</p>
    <div class="sectionhead"><h2>Results</h2><p>Ordered by number of matches in the block.</p></div>
    ${body}`;
}

/* ---------------- render ---------------- */
function render(){
  const main = $("#main");
  if(query.trim().length>=2){ main.innerHTML = renderSearch(query.trim()); }
  else if(view.kind==="role"){ main.innerHTML = renderRole(DATA.roles.find(r=>r.id===view.id)); }
  else if(view.kind==="gates"){ main.innerHTML = renderGates(); }
  else if(view.kind==="config"){ main.innerHTML = renderConfig(); }
  else if(view.kind==="reflection"){ main.innerHTML = renderReflection(); }
  else if(view.kind==="changes"){ main.innerHTML = renderChanges(); }
  else if(view.kind==="edits"){ main.innerHTML = renderEdits(); }
  else { main.innerHTML = renderShared(); }
  syncRail();
  main.scrollTop = 0;
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]");
  if(t){
    const row = t.closest(".row");
    const open = row.dataset.open === "true";
    row.dataset.open = open ? "false" : "true";
    row.querySelector(".rowbody").hidden = open;
    return;
  }
  const sg = e.target.closest("[data-suggest]");
  if(sg){
    const span = sg.dataset.suggest, row = sg.dataset.row;
    if(sg.dataset.idx !== undefined) SHOWING.set(span, Number(sg.dataset.idx));
    else if(SHOWING.has(span)) SHOWING.delete(span);
    else SHOWING.set(span, 0);
    paintSuggestion(span, row);
    return;
  }
  const ed = e.target.closest("[data-edit]");
  if(ed){ openEditor(ed.dataset.edit); return; }
  const sv = e.target.closest("[data-save]");
  if(sv){ saveEdit(sv.dataset.save); return; }
  const cx = e.target.closest("[data-cancel]");
  if(cx){ document.getElementById("ed-"+cx.dataset.cancel).innerHTML = ""; return; }
  const wd = e.target.closest("[data-withdraw]");
  if(wd){ setStatus(wd.dataset.withdraw, "withdrawn");
          const slot = wd.closest(".editslot"); if(slot) slot.innerHTML = ""; return; }
  const rs = e.target.closest("[data-restore]");
  if(rs){ setStatus(rs.dataset.restore, "open"); return; }

  const c = e.target.closest("[data-copy]");
  if(c){
    const txt = document.getElementById("txt-"+c.dataset.copy).textContent;
    navigator.clipboard?.writeText(txt).then(()=>{
      c.textContent = "copied"; setTimeout(()=>c.textContent="copy text", 1400);
    });
  }
});

document.addEventListener("change", e=>{
  if(e.target.matches("[data-name]")) setAuthor(e.target.value);
});

$("#q").addEventListener("input", e=>{ query = e.target.value; render(); });
/* ---------- the side panel, hidden or shown ----------
   Remembered per viewer in localStorage: it is a reading preference, not
   shared state, and every access is guarded because a private window or
   blocked site data makes the accessor throw rather than return null. */
const RAIL_KEY = "promptmap.rail";
const shell = document.querySelector(".shell");
const railBtn = $("#railtoggle");

function setRail(on){
  shell.dataset.rail = on ? "on" : "off";
  railBtn.setAttribute("aria-expanded", on ? "true" : "false");
  const label = on ? "Hide the side panel" : "Show the side panel";
  railBtn.setAttribute("aria-label", label);
  railBtn.title = label + "  (\\)";
  try { localStorage.setItem(RAIL_KEY, on ? "on" : "off"); } catch(_) {}
}

let railOpen = true;
try { railOpen = localStorage.getItem(RAIL_KEY) !== "off"; } catch(_) { railOpen = true; }
setRail(railOpen);
railBtn.addEventListener("click", () => setRail(shell.dataset.rail === "off"));

document.addEventListener("keydown", e=>{
  if(e.key==="/" && e.target.tagName!=="INPUT"){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape" && e.target.id==="q"){ e.target.value=""; query=""; render(); }
  if(e.key==="\\" && e.target.tagName!=="INPUT" && e.target.tagName!=="TEXTAREA"){
    e.preventDefault(); setRail(shell.dataset.rail === "off");
  }
});

indexSpans();
buildRail();
render();
/* The page is complete and readable before this resolves; editing lights up
   when — and only when — the viewer's runtime grants the store. */
initEdits();
</script>
