<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adda — run 20261001T001224</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Tokens. Light is the bare :root; dark redefines tokens only. ─────────── */
:root{
  --ground:#F2F3F0; --surface:#FFFFFF; --surface-2:#F8F9F7; --sunken:#E9EBE6;
  --ink:#14181D; --ink-2:#48505A; --ink-3:#6B737D; --rule:#D9DCD5; --rule-strong:#BFC4BB;
  --select:#2B4ACB; --select-wash:rgba(43,74,203,.08); --focus:#2B4ACB;
  --ok:#2E7D4F; --warn:#A06410; --bad:#C2402A; --live:#2B4ACB; --idle:#8A929B;
  --r-strategizer:#2B2F36; --r-literature_reviewer:#7A5AA6; --r-datagenerator:#B0601E;
  --r-implementer:#1F7F86; --r-critic:#B23A6A;
  --hatch:repeating-linear-gradient(135deg,transparent 0 4px,rgba(20,24,29,.07) 4px 5px);
  --shadow:0 1px 0 rgba(20,24,29,.04),0 1px 3px rgba(20,24,29,.06);
  --f-ui:"Instrument Sans",system-ui,sans-serif; --f-mono:"Geist Mono",ui-monospace,monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --t-meta:12px; --t-data:13px; --t-body:14px; --t-sec:16px; --t-title:20px; --t-vital:26px;
  --hour:76px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1114; --surface:#151A1F; --surface-2:#1A2026; --sunken:#0B0E11;
  --ink:#E7EAEC; --ink-2:#AAB2BB; --ink-3:#87909A; --rule:#262D35; --rule-strong:#36404A;
  --select:#7E95FF; --select-wash:rgba(126,149,255,.12); --focus:#7E95FF;
  --ok:#5DBB86; --warn:#E0A54B; --bad:#F07560; --live:#7E95FF; --idle:#6E7781;
  --r-strategizer:#C9CED4; --r-literature_reviewer:#B79BE0; --r-datagenerator:#E39457;
  --r-implementer:#4FC1C9; --r-critic:#EC79A4;
  --hatch:repeating-linear-gradient(135deg,transparent 0 4px,rgba(231,234,236,.08) 4px 5px);
  --shadow:0 1px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#0E1114; --surface:#151A1F; --surface-2:#1A2026; --sunken:#0B0E11;
  --ink:#E7EAEC; --ink-2:#AAB2BB; --ink-3:#87909A; --rule:#262D35; --rule-strong:#36404A;
  --select:#7E95FF; --select-wash:rgba(126,149,255,.12); --focus:#7E95FF;
  --ok:#5DBB86; --warn:#E0A54B; --bad:#F07560; --live:#7E95FF; --idle:#6E7781;
  --r-strategizer:#C9CED4; --r-literature_reviewer:#B79BE0; --r-datagenerator:#E39457;
  --r-implementer:#4FC1C9; --r-critic:#EC79A4;
  --hatch:repeating-linear-gradient(135deg,transparent 0 4px,rgba(231,234,236,.08) 4px 5px);
  --shadow:0 1px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:var(--t-body)/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

/* ── Shell ──────────────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
.nav{border-right:1px solid var(--rule);background:var(--surface-2);display:flex;flex-direction:column;min-height:0}
.brand{padding:var(--s4) var(--s4) var(--s3);display:flex;align-items:baseline;gap:var(--s2)}
.brand b{font-weight:600;font-size:var(--t-sec);letter-spacing:-.01em}
.brand span{color:var(--ink-3);font-size:var(--t-meta)}
.nav h6{margin:var(--s4) var(--s4) var(--s1);font:500 11px/1 var(--f-ui);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:6px var(--s4);color:var(--ink-2);text-decoration:none;font-size:var(--t-data)}
.nav a:hover{background:var(--sunken)}
.nav a.on{color:var(--ink);background:var(--select-wash);box-shadow:inset 2px 0 0 var(--select)}
.nav a .mono{font-size:11.5px;color:var(--ink-3);white-space:nowrap;margin-left:var(--s2)}
.nav .grow{flex:1}
.nav .foot{padding:var(--s3) var(--s4);border-top:1px solid var(--rule);display:flex;gap:var(--s2)}
.btn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:var(--t-data);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}

.main{display:grid;grid-template-rows:auto auto 1fr;min-width:0;min-height:0}

/* Title block: the run's identity and vitals in one strip, like a drawing's title block. */
.title{display:grid;grid-template-columns:minmax(260px,1.2fr) repeat(4,minmax(110px,.7fr)) auto;border-bottom:1px solid var(--rule);background:var(--surface)}
.title>div{padding:var(--s3) var(--s4);border-right:1px solid var(--rule);min-width:0}
.title>div:last-child{border-right:0;display:flex;align-items:center;gap:var(--s2)}
.lbl{font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.who{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-meta);color:var(--ink-3)}
.runid{font-size:var(--t-title);font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:var(--s2);white-space:nowrap}
.vital{font:500 var(--t-vital)/1.1 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.vital small{font-size:var(--t-data);color:var(--ink-3);font-weight:400;margin-left:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-ui);padding:5px 8px 5px 7px;border-radius:999px;border:1px solid currentColor}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)} .pill.live{color:var(--live)} .pill.bad{color:var(--bad)}
.clock{position:relative;height:6px;background:var(--sunken);border-radius:3px;margin-top:8px}
.clock b{position:absolute;inset:0 auto 0 0;background:var(--ink-2);border-radius:3px}
.clock u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.clock em{position:absolute;top:10px;font:400 10.5px/1 var(--f-mono);color:var(--ink-3);transform:translateX(-50%);font-style:normal}

/* View switcher */
.views{display:flex;align-items:center;gap:2px;padding:0 var(--s4);border-bottom:1px solid var(--rule);background:var(--surface);height:42px}
.views button{border:0;background:none;padding:0 var(--s3);height:42px;font-size:var(--t-data);color:var(--ink-2);cursor:pointer;position:relative}
.views button.on{color:var(--ink);font-weight:500}
.views button.on::after{content:"";position:absolute;left:var(--s3);right:var(--s3);bottom:-1px;height:2px;background:var(--ink)}
.views .sp{flex:1}
.views .hint{font-size:var(--t-meta);color:var(--ink-3)}
kbd{font:500 11px/1 var(--f-mono);border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:4px;padding:2px 4px;color:var(--ink-2)}

/* Body: work area + inspector */
.body{display:grid;grid-template-columns:1fr 440px;min-height:0}
.work{overflow:auto;min-width:0;position:relative}
.insp{border-left:1px solid var(--rule);background:var(--surface);overflow:auto;min-height:0}

/* Question banner: the agents are blocked on a human. Highest-priority surface. */
.ask{margin:var(--s4) var(--s4) 0;border:1px solid var(--select);background:var(--select-wash);border-radius:8px;padding:var(--s3) var(--s4);display:grid;grid-template-columns:1fr auto;gap:var(--s2) var(--s4);align-items:center}
.ask p{margin:0}
.ask .q{font-weight:500}
.ask .from{font-size:var(--t-meta);color:var(--ink-2)}

/* ── Timeline ───────────────────────────────────────────────────────────── */
.tl{display:grid;grid-template-columns:56px 1fr;padding:var(--s4) var(--s4) var(--s6) 0;position:relative}
.ruler{position:relative}
.ruler div{position:absolute;right:10px;font:400 11px/1 var(--f-mono);color:var(--ink-3);transform:translateY(-50%)}
.lanes{position:relative;border-left:1px solid var(--rule)}
.hr{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
.lanehead{position:sticky;top:0;z-index:3;display:grid;background:var(--ground);border-bottom:1px solid var(--rule);height:26px;margin-bottom:var(--s2)}
.lanehead span{font:500 11px/26px var(--f-ui);color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;padding-left:var(--s2)}
.card{position:absolute;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:6px 8px 6px 10px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s;display:flex;flex-direction:column;gap:2px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--role)}
.card:hover{border-color:var(--rule-strong)}
.card.sel{border-color:var(--select);box-shadow:0 0 0 1px var(--select)}
.card.dim{opacity:.35}
.card .top{display:flex;align-items:center;gap:6px;min-width:0}
.card .id{font:500 12px/1.2 var(--f-mono)}
.card .role{font-size:11.5px;color:var(--role);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .dur{margin-left:auto;font:400 11px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.card .intent{font-size:12.5px;color:var(--ink-2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.chip{font:500 10.5px/1 var(--f-mono);padding:3px 5px;border-radius:4px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.chip.f{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.h{background:transparent;border:1px solid var(--rule-strong)}
.gate{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--gc);z-index:2}
.gate span{position:absolute;right:0;top:-11px;background:var(--ground);padding:0 6px;font:500 11px/20px var(--f-mono);color:var(--gc);border:1px solid var(--gc);border-radius:4px;cursor:pointer}
.now{position:absolute;left:-56px;right:0;border-top:1.5px solid var(--live);z-index:4}
.now span{position:absolute;left:4px;top:-9px;font:500 10.5px/16px var(--f-mono);color:var(--live);background:var(--ground);padding:0 3px}

/* ── Inspector ──────────────────────────────────────────────────────────── */
.ih{padding:var(--s4) var(--s5) var(--s3);border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--surface);z-index:2}
.ih .row{display:flex;align-items:center;gap:var(--s2)}
.ih h2{margin:0;font:600 var(--t-title)/1.2 var(--f-mono);letter-spacing:-.02em}
.ih .role{font-size:var(--t-data);color:var(--role)}
.ih .x{margin-left:auto}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.facts div{padding:var(--s3) var(--s4);border-right:1px solid var(--rule);min-width:0}
.facts div:last-child{border-right:0}
.facts b{display:block;font:500 17px/1.2 var(--f-ui);font-variant-numeric:tabular-nums}
.sec{padding:var(--s4) var(--s5);border-bottom:1px solid var(--rule)}
.sec h3{margin:0 0 var(--s2);font:600 var(--t-data)/1 var(--f-ui);color:var(--ink-2)}
.sec p{margin:0;font-size:var(--t-body);color:var(--ink);max-width:62ch;white-space:pre-wrap}
.links{display:flex;flex-direction:column}
.links a{display:grid;grid-template-columns:44px 1fr auto;gap:var(--s2);padding:6px 0;border-top:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:var(--t-data);align-items:baseline}
.links a:first-child{border-top:0}
.links a .mono{font-size:12px}
.st{font:500 11px/1 var(--f-ui);display:inline-flex;align-items:center;gap:5px}
.st::before{content:"";width:8px;height:8px;display:inline-block}
.st.SUPPORTED{color:var(--ok)} .st.SUPPORTED::before{background:currentColor;border-radius:50%}
.st.FALSIFIED{color:var(--bad)} .st.FALSIFIED::before{background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}
.st.INCONCLUSIVE{color:var(--warn)} .st.INCONCLUSIVE::before{border:1.5px solid currentColor;border-radius:2px;width:6px;height:6px}
.st.OPEN{color:var(--ink-3)} .st.OPEN::before{border:1.5px solid currentColor;border-radius:50%;width:6px;height:6px}
.actions{display:flex;gap:var(--s2);padding:var(--s4) var(--s5)}

/* ── Hypotheses view ────────────────────────────────────────────────────── */
.hyps{padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:0;max-width:980px}
.hyp{display:grid;grid-template-columns:48px 1fr 160px;gap:var(--s4);padding:var(--s4) 0;border-top:1px solid var(--rule);cursor:pointer}
.hyp:hover .stmt{color:var(--ink)}
.hyp .hid{font:600 15px/1.3 var(--f-mono)}
.hyp .stmt{color:var(--ink-2);font-size:var(--t-body);line-height:1.45}
.post{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bar{position:relative;width:140px;height:6px;background:var(--sunken);border-radius:3px}
.bar b{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ink-2)}

/* ── Data view ──────────────────────────────────────────────────────────── */
.data{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);max-width:1100px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:var(--s4) var(--s5)}
.panel h3{margin:0;font:600 var(--t-sec)/1.2 var(--f-ui)}
.panel .sub{color:var(--ink-3);font-size:var(--t-meta);margin-top:2px}
.legend{display:flex;gap:var(--s4);font-size:var(--t-meta);color:var(--ink-2);margin-top:var(--s2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg text{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-3)}

/* ── Narrow (phone): monitor-first ──────────────────────────────────────── */
@media (max-width:820px){
  .tl{display:block;padding:var(--s3)} .ruler,.lanehead,.hr,.gate{display:none}
  .lanes{border:0;height:auto!important} .lanes>div:not(.lanehead){height:auto!important;display:flex;flex-direction:column;gap:var(--s2)}
  .card{position:relative!important;top:auto!important;left:auto!important;width:auto!important;height:auto!important;min-height:0}
  .card .intent{-webkit-line-clamp:2}
  .app{grid-template-columns:1fr}
  .nav{display:none}
  .title{grid-template-columns:1fr 1fr}
  .title>div:first-child{grid-column:1/-1}
  .title>div{border-bottom:1px solid var(--rule)}
  .title>div:last-child{grid-column:1/-1;justify-content:flex-start}
  .body{grid-template-columns:1fr}
  .insp{display:none}
  .insp.open{display:block;position:fixed;inset:0;z-index:20}
  .views{overflow-x:auto}
  .views .hint{display:none}
  .hyp{grid-template-columns:40px 1fr}
  .hyp .post{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pill.live i{animation:pulse 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Studies and runs">
    <div class="brand"><b>adda</b><span>on harrislab-mbp</span></div>
    <h6>Studies</h6>
    <a href="#">example_study <span class="mono">4 runs</span></a>
    <a href="#" class="on">supercompressible-zeroshot <span class="mono">2 runs</span></a>
    <a href="#">smoke_parallel <span class="mono">1 run</span></a>
    <h6>Runs · supercompressible-zeroshot</h6>
    <a href="#" class="on"><span class="mono" style="color:var(--ink)">20261001T001224</span><span class="st SUPPORTED" style="color:var(--ok)">gated</span></a>
    <a href="#"><span class="mono">20260928T225501</span><span class="st SUPPORTED" style="color:var(--ok)">gated</span></a>
    <div class="grow"></div>
    <div class="foot"><button class="btn">New study</button><button class="btn ghost" id="theme" title="Theme">◐</button></div>
  </nav>

  <section class="main">
    <header class="title" id="title"></header>
    <div class="views" role="tablist">
      <button class="on" data-v="timeline">Timeline</button>
      <button data-v="hyp">Hypotheses</button>
      <button data-v="data">Data</button>
      <button data-v="deliv">Deliverable</button>
      <button data-v="logs">Logs</button>
      <button data-v="setup">Setup</button>
      <span class="sp"></span>
      <span class="hint"><kbd>j</kbd> <kbd>k</kbd> step · <kbd>/</kbd> find · <kbd>esc</kbd> close</span>
    </div>
    <div class="body">
      <div class="work" id="work"></div>
      <aside class="insp" id="insp" aria-label="Inspector"></aside>
    </div>
  </section>
</div>

<script>
const ROLE_LABEL={strategizer:"strategizer",literature_reviewer:"literature",datagenerator:"datagen",implementer:"implementer",critic:"critic"};
let DATA, sel="D012", view="timeline";
const $=s=>document.querySelector(s);
const t=s=>new Date(s).getTime();
const fmtDur=ms=>{const m=Math.round(ms/60000);return m<60?`${m} m`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`};
const firstClause=s=>{s=s.replace(/\s+/g," ").trim();const i=s.search(/[.:(]/);return i>30&&i<140?s.slice(0,i):s.slice(0,130)};

fetch("s55r2_sample.json").then(r=>r.json()).then(d=>{DATA=d;renderTitle();render()});

function bestX(){return Math.max(...DATA.points.filter(p=>(p.feasible===1||p.feasible===true)&&p.sigma!=null).map(p=>p.sigma/DATA.bessa))}
function renderTitle(){
  const r=DATA.run, el=r.elapsed_s, b=r.budget_s, pct=Math.min(el/(2*b),1);
  $("#title").innerHTML=`
  <div><div class="who">${r.study} · ${r.model}</div>
    <div class="runid"><span class="mono">${r.id}</span><span class="pill ok"><i></i>Gated · closed</span></div></div>
  <div><div class="lbl">Wall clock</div><div class="vital">${(el/3600).toFixed(1)}<small>h / ${b/3600} h</small></div>
    <div class="clock" title="1× budget, 1.5× no new delegations, 2× stop"><b style="width:${pct*100}%"></b>
      <u style="left:50%"></u><u style="left:75%"></u><u style="left:100%"></u></div></div>
  <div><div class="lbl">Best σ</div><div class="vital">${bestX().toFixed(1)}<small>× Bessa</small></div></div>
  <div><div class="lbl">Evaluations</div><div class="vital">${r.evals}</div></div>
  <div><div class="lbl">Cost</div><div class="vital">$${r.cost.toFixed(0)}<small>+1 unknown</small></div></div>
  <div><button class="btn">Note to run</button><button class="btn" disabled title="Run is closed">Stop</button><button class="btn primary">Re-run study</button></div>`;
}

function render(){
  document.querySelectorAll(".views button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(view==="timeline") renderTimeline(); else if(view==="hyp") renderHyps(); else if(view==="data") renderData();
  else $("#work").innerHTML=`<div class="data"><div class="panel"><h3>${view}</h3><div class="sub">Not mocked in this prototype; see the spec.</div></div></div>`;
  renderInspector();
}

function lanesFor(ds,t0,pxPerMs,minPx){
  const lanes=[];
  ds.forEach(d=>{const s=t(d.started_at),e=Math.max(t(d.completed_at||d.started_at),s+minPx/pxPerMs+90000);
    let k=lanes.findIndex(end=>end<=s); if(k<0){k=lanes.length;lanes.push(0)} lanes[k]=e; d._lane=k; d._s=s; d._e=e;});
  return lanes.length;
}

function renderTimeline(){
  const ds=DATA.delegations.filter(d=>d.to_node!=="critic"||d.status==="FEEDBACK").filter(d=>!d.id.startsWith("GATE"));
  const gates=DATA.delegations.filter(d=>d.id.startsWith("GATE"));
  const t0=Math.min(...DATA.delegations.map(d=>t(d.started_at)))-10*60000;
  const t1=Math.max(...DATA.delegations.map(d=>t(d.completed_at||d.started_at)))+15*60000;
  const pxPerMs=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"))/3600000;
  const minPx=58, n=lanesFor(ds,t0,pxPerMs,minPx), H=(t1-t0)*pxPerMs;
  const y=ms=>(ms-t0)*pxPerMs;
  let ruler="",hrs="";
  const tStart=t(DATA.delegations[0].started_at)-0; for(let h=tStart+3600000;h<t1;h+=3600000){const lab=`+${Math.round((h-tStart)/3600000)} h`;
    ruler+=`<div style="top:${y(h)+34}px">${lab}</div>`;hrs+=`<div class="hr" style="top:${y(h)}px"></div>`}
  const lw=100/n;
  const cards=ds.map(d=>{const top=y(d._s),h=Math.max((t(d.completed_at||d.started_at)-d._s)*pxPerMs,minPx);
    const chips=[d.is_falsification_attempt?`<span class="chip f">falsification</span>`:"",...d.hypothesis_ids.slice(0,3).map(h=>`<span class="chip h">${h}</span>`),d.evals?`<span class="chip">${d.evals} evals</span>`:""].join("");
    return `<div class="card ${d.id===sel?"sel":""}" data-id="${d.id}" style="--role:var(--r-${d.to_node});top:${top}px;height:${h-4}px;left:calc(${d._lane*lw}% + 6px);width:calc(${lw}% - 12px)">
      <div class="top"><span class="id">${d.id}</span><span class="role">${ROLE_LABEL[d.to_node]}</span><span class="dur">${fmtDur(t(d.completed_at)-d._s)}</span></div>
      ${h>70?`<div class="intent">${firstClause(d.task)}</div>`:""}
      ${h>96?`<div class="chips">${chips}</div>`:""}</div>`}).join("");
  const gl=gates.map(g=>{const v=g.status.split(":")[1]; const c=v==="PASS"?"var(--ok)":v==="REVISE"?"var(--warn)":v==="REJECT"?"var(--bad)":"var(--ink-3)";
    return `<div class="gate" style="--gc:${c};top:${y(t(g.started_at))}px"><span data-id="${g.id}">gate · ${v.toLowerCase()}</span></div>`}).join("");
  const heads=Array.from({length:n},(_,i)=>`<span>slot ${i+1}</span>`).join("");
  $("#work").innerHTML=`<div class="tl"><div class="ruler" style="height:${H}px">${ruler}</div>
    <div class="lanes" style="height:${H+34}px"><div class="lanehead" style="grid-template-columns:repeat(${n},1fr)">${heads}</div>
    <div style="position:relative;height:${H}px">${hrs}${cards}${gl}</div></div></div>`;
  $("#work").querySelectorAll("[data-id]").forEach(c=>c.onclick=()=>{sel=c.dataset.id;render()});
}

function renderHyps(){
  $("#work").innerHTML=`<div class="hyps">${DATA.hypotheses.map(h=>`
    <div class="hyp" data-h="${h.id}"><div class="hid">${h.id}</div>
      <div><div class="stmt">${h.statement}</div></div>
      <div class="post"><span class="st ${h.status}">${h.status.toLowerCase()}</span>
        <div class="bar" title="posterior ${h.posterior}"><b style="width:${h.posterior*100}%"></b></div>
        <span class="mono" style="font-size:11px;color:var(--ink-3)">posterior ${h.posterior.toFixed(2)}</span></div></div>`).join("")}</div>`;
}

function renderData(){
  const B=DATA.bessa, pts=DATA.points.filter(p=>p.ns==="freeform"&&p.sigma!=null).sort((a,b)=>t(a.ts)-t(b.ts));
  const W=980,H=360,P={l:48,r:16,t:16,b:30};
  const t0=t(DATA.delegations[0].started_at), t1=t0+13*3600000, ymax=25;
  const X=ms=>P.l+(ms-t0)/(t1-t0)*(W-P.l-P.r), Y=v=>H-P.b-Math.min(v,ymax)/ymax*(H-P.t-P.b);
  let best=0,path="";pts.forEach(p=>{if(p.feasible===1||p.feasible===true){const v=p.sigma/B;if(v>best){const x=X(t(p.ts));path+=path?`H${x}V${Y(v)}`:`M${x},${Y(v)}`;best=v}}});
  path+="H"+X(t1);
  const dots=pts.map(p=>{const f=p.feasible===1||p.feasible===true;return `<circle cx="${X(t(p.ts))}" cy="${Y(p.sigma/B)}" r="2.6" fill="${f?"var(--r-implementer)":"none"}" stroke="${f?"none":"var(--ink-3)"}" stroke-width="1" opacity="${f?.9:.55}"/>`}).join("");
  let grid="";[0,5,10,15,20,25].forEach(v=>grid+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${P.l-8}" y="${Y(v)+3}" text-anchor="end">${v}×</text>`);
  for(let h=0;h<=13;h+=2)grid+=`<text x="${X(t0+h*3600000)}" y="${H-10}" text-anchor="middle">${h} h</text>`;
  $("#work").innerHTML=`<div class="data"><div class="panel"><h3>Best feasible σ so far</h3><div class="sub">namespace freeform · σ_peak / Bessa point (0.1122 kPa) · ${pts.length} evaluated rows</div>
   <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:12px" role="img" aria-label="Best feasible sigma over wall time">
    ${grid}<line x1="${P.l}" x2="${W-P.r}" y1="${Y(1)}" y2="${Y(1)}" stroke="var(--ink-2)" stroke-dasharray="3 3"/><text x="${W-P.r}" y="${Y(1)-5}" text-anchor="end">1× pass bar</text>
    <line x1="${P.l}" x2="${W-P.r}" y1="${Y(10)}" y2="${Y(10)}" stroke="var(--select)" stroke-dasharray="6 4"/><text x="${W-P.r}" y="${Y(10)-5}" text-anchor="end" style="fill:var(--select)">10× target</text>
    ${dots}<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>
   <div class="legend"><span><svg width="10" height="10"><circle cx="5" cy="5" r="3.5" fill="var(--r-implementer)"/></svg>feasible</span><span><svg width="10" height="10"><circle cx="5" cy="5" r="3" fill="none" stroke="var(--ink-3)"/></svg>infeasible</span><span><svg width="18" height="10"><line x1="0" x2="18" y1="5" y2="5" stroke="var(--ink)" stroke-width="2"/></svg>best so far</span></div></div></div>`;
}

function renderInspector(){
  const d=DATA.delegations.find(x=>x.id===sel)||DATA.delegations[0];
  const hy=DATA.hypotheses.filter(h=>d.hypothesis_ids.includes(h.id));
  $("#insp").innerHTML=`
  <div class="ih" style="--role:var(--r-${d.to_node})"><div class="row"><h2>${d.id}</h2><span class="role">${ROLE_LABEL[d.to_node]}</span>
    <span class="st ${d.status==="DONE"?"SUPPORTED":"OPEN"}" style="margin-left:6px">${d.status.toLowerCase()}</span>
    <button class="btn ghost x" aria-label="Close inspector">✕</button></div>
    <div class="mono" style="font-size:11.5px;color:var(--ink-3);margin-top:4px">${d.started_at.slice(11,16)} → ${(d.completed_at||"").slice(11,16)} UTC · from strategizer · ${Math.round((d.tokens_out||0)/1000)}k output tokens</div></div>
  <div class="facts"><div><div class="lbl">Duration</div><b>${fmtDur(t(d.completed_at)-t(d.started_at))}</b></div>
    <div><div class="lbl">Evals</div><b>${d.evals}</b></div><div><div class="lbl">Cost</div><b>$${(d.cost_usd||0).toFixed(2)}</b></div>
</div>
  <div class="sec"><h3>Task</h3><p>${d.task}</p></div>
  <div class="sec"><h3>Hypotheses it carries</h3><div class="links">${hy.map(h=>`<a href="#"><span class="mono">${h.id}</span><span>${h.statement.slice(0,90)}…</span><span class="st ${h.status}">${h.status.toLowerCase()}</span></a>`).join("")||`<span style="color:var(--ink-3);font-size:13px">None registered.</span>`}</div></div>
  <div class="sec"><h3>Report</h3><p style="color:var(--ink-3)">The delegation's deliverable renders here, with math, and its files below it.</p></div>
  <div class="actions"><button class="btn">Open transcript</button><button class="btn">Files touched</button><button class="btn">Nudge</button></div>`;
}

document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  const ids=DATA.delegations.filter(d=>!d.id.startsWith("GATE")).sort((a,b)=>t(a.started_at)-t(b.started_at)).map(d=>d.id);
  const i=ids.indexOf(sel);
  if(e.key==="j"&&i<ids.length-1){sel=ids[i+1];render()} if(e.key==="k"&&i>0){sel=ids[i-1];render()}
});
$("#theme").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
</script>
</body>
</html>
